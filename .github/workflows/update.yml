name: Update FPL data

on:
  schedule:
    - cron: "0 8,18 * * *"     # after FPL Core Insights refreshes (07:30 and 17:30 UTC)
    - cron: "0 11,15,21 * * 5" # extra Friday runs for late team news before the deadline
    - cron: "30 16 * * 5"      # just after the free weekend odds file is published
    - cron: "20 * * * *"       # hourly, but only goes ahead in the 12 hours before a deadline (see the gate job)
  workflow_dispatch: {}         # adds a "Run workflow" button

permissions:
  contents: write   # to save each week's pre-deadline projections for the live accuracy log
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  gate:
    # The hourly trigger only goes ahead in the 12 hours before an FPL deadline, to catch late team news.
    # Every other trigger (the daily schedule, the Run workflow button) always goes ahead.
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT" != "schedule" ] || [ "$CRON" != "20 * * * *" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          H=$(curl -sf --retry 3 https://fantasy.premierleague.com/api/bootstrap-static/ | python3 -c "
          import sys, json, datetime as d
          ev = [e for e in json.load(sys.stdin)['events'] if e.get('is_next')]
          t = d.datetime.fromisoformat(ev[0]['deadline_time'].replace('Z', '+00:00')) if ev else None
          print(round((t - d.datetime.now(d.timezone.utc)).total_seconds() / 3600, 2) if t else -1)" || echo -1)
          echo "Hours to the next deadline: $H"
          if python3 -c "import sys; h = float('$H'); sys.exit(0 if 0 < h <= 12 else 1)"; then echo "run=true" >> "$GITHUB_OUTPUT"; else echo "run=false" >> "$GITHUB_OUTPUT"; fi

  build-and-deploy:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Pull data, run the model, simulations and accuracy checks
        env:
          FPL_TEAM_ID: ${{ vars.FPL_TEAM_ID }}
          FPL_LEAGUE_ID: ${{ vars.FPL_LEAGUE_ID }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}          # optional: your ntfy.sh topic for the deadline reminder
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python engine/fpl_engine.py --out site/data.json
      - name: Live gameweek scores (only does anything while a gameweek is on)
        env:
          FPL_TEAM_ID: ${{ vars.FPL_TEAM_ID }}
        run: python engine/live.py --out site/live.json || true
      - name: Keep the pre-deadline forecast history
        run: |
          git config user.name "fpl-lab-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/history
          git diff --cached --quiet || (git commit -m "Save pre-deadline projections" && git push)
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
