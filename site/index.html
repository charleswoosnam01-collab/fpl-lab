      ex.push({buys: best.steps[0].buys.map(p => p.id)});
      for (let k = 0; k < 2; k++){ try { const r = await solveExact(sq, Number(state.squad.bank || 0), Number(state.squad.ft || 0), {exclude: ex.slice()});
          out.push({res: r, gap: planTotal(r) - planTotal(best)}); ex.push({buys: r.steps[0].buys.map(p => p.id)}); } catch(e) { break; } }
      state.alts = out; render(); }, 40); }
  else if (d.hitsmode){ RULES.hits = d.hitsmode; saveRules(); render(); }
  else if (d.horizon){ RULES.H = +d.horizon; saveRules(); render(); }
  else if (d.pfn){ state.pf.n = +d.pfn; render(); }
  else if (d.pfm){ state.pf.metric = d.pfm; render(); }
  else if (d.pfpos !== undefined){ state.pf.pos = +d.pfpos; render(); }
  else if (d.ftvenue){ state.ft.venue = d.ftvenue; render(); }
  else if (d.ftwin){ state.ft.win = d.ftwin === "season" ? "season" : +d.ftwin; render(); }
  else if (d.ftkey){ state.ft.key = d.ftkey; render(); }
  else if (d.minset){ const pid = +d.pid, v = +(($("#minsr") || {}).value || 0);
    if (d.minset === "reset") delete MINS[pid]; else MINS[pid] = {m: v, all: d.minset === "all"};
    saveMins(); P[pid].ep_noform = null; applyMinutes(P[pid]); applyWhatIfs(); state.plan = null; state.exact = null; state.chipPlan = null; render(); openPlayer(pid);
    toast(d.minset === "reset" ? "Back to the model’s minutes" : `Set to ${v} minutes for ${d.minset === "all" ? "all six gameweeks" : "this gameweek"}`); }
  else if (d.gwstep){ state.pitchGw = Math.max(0, Math.min(GWS.length - 1, state.pitchGw + +d.gwstep)); render(); }
  else if (d.pitch){ openPitchPlayer(+d.pitch); }
  else if (d.luact){ lineupAction(d.luact, +d.pid, d.with ? +d.with : null); closeSheet(); render(); }
  else if (d.luclear){ delete state.lu[state.pitchGw]; render(); }
  else if (d.solve){ el.textContent = "Solving…"; el.disabled = true; setTimeout(async () => { const sq = state.squad.ids.map(id => P[id]);
      try { state.exact = await solveExact(sq, Number(state.squad.bank || 0), Number(state.squad.ft || 0), {noHits: d.solve === "nohits"}); state.solveError = null;
        state.exact.gain = planTotal(state.exact) - planBase(state.exact.H); rememberResult(state.exact); state.alts = null; }
      catch(err){ if (String(err.message) === "INFEASIBLE"){ state.exact = null; state.solveError = null; toast("Those rules can’t all be met: check the budget, positions or three-per-club limit."); }
        else { state.solveError = String(err.message || err).slice(0, 80); state.plan = planTransfers(sq, Number(state.squad.bank || 0), Number(state.squad.ft || 0)); } }
      state.stress = null; render(); }, 40); }
  else if (d.stress){ el.textContent = "Testing…"; el.disabled = true; setTimeout(async () => { const sq = state.squad.ids.map(id => P[id]), counts = {}, N = 6;
      for (let k = 0; k < N; k++){
        const noise = {}; D.players.forEach(p => noise[p.id] = Array.from({length: GWS.length}, () => Math.max(0.3, 1 + 0.28 * (Math.random() + Math.random() + Math.random() - 1.5))));
        try { const r = await solveExact(sq, Number(state.squad.bank || 0), Number(state.squad.ft || 0), {H: 4, pool: 14, time: 6, gap: 0.01, fresh: true, epAt: (p, t) => p.ep[t] * noise[p.id][t]});
          const s0 = r.steps[0]; if (!s0.sells.length) counts["Roll the transfer"] = (counts["Roll the transfer"] || 0) + 1;
          s0.sells.forEach(p => counts["Sell " + p.n] = (counts["Sell " + p.n] || 0) + 1); s0.buys.forEach(p => counts["Buy " + p.n] = (counts["Buy " + p.n] || 0) + 1); } catch(e) {}
      }
      state.stress = {n: N, counts}; render(); }, 40); }
  else if (d.compass){ openCompass(); }
  else if (d.quick !== undefined){ state.pl.quick = d.quick || null; state.pl.limit = 50; render(); }
  else if (d.capsrc && !d.goto){ state.capSrc = d.capsrc; render(); }
  else if (d.backup === "export"){ exportSettings(); }
  else if (d.pbview){ state.pbView = d.pbview; const t = $("#sheetTitle"); const id = $("#sheetBody [data-cmp]") ? +$("#sheetBody [data-cmp]").dataset.cmp : null; if (id) { const sc = $(".sheet").scrollTop; openPlayer(id); $(".sheet").scrollTop = sc; } }
  else if (d.plverdict !== undefined){ state.pl.verdict = d.plverdict; state.pl.limit = 50; render(); openFilters(); }
  else if (d.filters){ openFilters(); }
  else if (d.sortpick){ if (state.pl.sort === d.sortpick) state.pl.dir = state.pl.dir === "asc" ? "desc" : "asc"; else { state.pl.sort = d.sortpick; state.pl.dir = "desc"; } state.pl.limit = 50; render(); openFilters(); }
  else if (d.draftoutsheet){ state.tq = ""; state.tqOut = +d.draftoutsheet; openTransferOut(+d.draftoutsheet); }
  else if (d.draftin){ addDraftMove(+d.draftout, +d.draftin); closeSheet(); render(); toast(`${P[+d.draftout].n} → ${P[+d.draftin].n} added to ${RULES.name}`); }
  else if (d.draftundo){ draftMoves().pop(); saveRules(); render(); }
  else if (d.draftreset){ RULES.moves = []; state.lu = {}; saveRules(); render(); toast("Draft cleared"); }
  else if (d.draftsolve){ const b = $("[data-solve]"); if (b){ b.scrollIntoView({behavior: "smooth", block: "center"}); b.click(); toast("Keeping your moves and solving the rest…"); } }
  else if (d.draftapply){ const now = draftMoves().filter(m => m.gw === GWS[0]); if (!now.length){ toast(`No moves in GW${GWS[0]} yet`); }
    else if (confirm(`Make ${now.length} GW${GWS[0]} move${now.length === 1 ? "" : "s"} part of your squad? Only do this once you’ve made them in FPL.`)){
      const st = draftState().weeks[0]; state.squad.ids = draftIdsAt(0); state.squad.bank = st.bank; state.squad.ft = Math.max(1, st.ftBefore - st.n);
      RULES.moves = draftMoves().filter(m => m.gw !== GWS[0]); saveRules(); saveSquad(); state.plan = null; state.chipPlan = null; render(); toast("Squad updated"); } }
  else if (d.flipdir){ state.pl.dir = state.pl.dir === "asc" ? "desc" : "asc"; state.pl.limit = 50; render(); }
  else if (d.maxpick !== undefined){ state.pl.max = +d.maxpick; state.pl.limit = 50; render(); openFilters(); }
  else if (d.pos !== undefined){ state.pl.pos = +d.pos; state.pl.limit = 50; render(); if ($("#sheet").open && $("#sheetTitle") && $("#sheetTitle").textContent === "Sort and filter") openFilters(); }
  else if (d.more){ state.pl.limit += 50; render(); }
  else if (d.fxmode){ state.fxMode = d.fxmode; render(); }
  else if (d.teamview){ state.teamView = d.teamview; render(); }
  else if (d.teamsort){ state.teamSort = d.teamsort; render(); }
  else if (d.team){ openTeam(+d.team); }
  else if (d.pick){ openPicker(+d.pick); }
  else if (d.pickadd){ if (addToSquad(+d.pickadd)){ closeSheet(); render(); } }
  else if (d.add){ if (addToSquad(+d.add)){ closeSheet(); render(); } }
  else if (d.remove){ removeFromSquad(+d.remove); if (d.close) closeSheet(); render(); }
  else if (d.cmp){ const id = +d.cmp; if (state.compare.includes(id)) state.compare = state.compare.filter(x => x !== id);
    else { if (state.compare.length >= 3) state.compare.shift(); state.compare.push(id); }
    closeSheet(); renderCompareBar(); toast(state.compare.length >= 2 ? "Tap Compare at the bottom to see them side by side." : "Added. Pick one or two more players to compare."); }
  else if (d.cmpopen){ openCompare(); }
  else if (d.cmpclear){ state.compare = []; renderCompareBar(); }
  else if (d.plan){ el.textContent = "Planning…"; setTimeout(() => { const sq = state.squad.ids.map(id => P[id]); state.plan = planTransfers(sq, Number(state.squad.bank || 0), Number(state.squad.ft || 0)); render(); }, 30); }
  else if (d.chips){ el.textContent = "Working it out…"; setTimeout(() => { const sq = state.squad.ids.map(id => P[id]); state.chipPlan = chipPlan(sq, state.plan); render(); }, 30); }
  else if (d.loadmy){ applyMyTeam(); render(); }
  else if (d.fxwin){ state.fxWin = +d.fxwin; if (state.fxSort !== "total" && !LONG.slice(0, state.fxWin).includes(+state.fxSort)) state.fxSort = "total"; render(); }
  else if (d.fxsort){ state.fxSort = d.fxsort; render(); }
  else if (d.squadview){ state.squadView = d.squadview; render(); }
  else if (d.close){ closeSheet(); }
  else if (d.open){ openPlayer(+d.open); }
});
document.addEventListener("keydown", e => { if ((e.key === "Enter" || e.key === " ") && e.target.matches("[data-open][role=button]")){ e.preventDefault(); openPlayer(+e.target.dataset.open); } });
document.addEventListener("input", e => {
  if (e.target.id === "tq"){ state.tq = e.target.value; const out = $("#tqlist [data-draftout]"); const oid = out ? +out.dataset.draftout : (state.tqOut || null);
      if (out) state.tqOut = +out.dataset.draftout; if (state.tqOut) { const sc = $(".sheet").scrollTop; openTransferOut(state.tqOut); $(".sheet").scrollTop = sc; } }
  if (e.target.id === "ruleq"){ state.ruleQ = e.target.value; const box = $("#rulefound"); if (box){ const sq = state.squad.ids.map(id => P[id]);
      const tmp = document.createElement("div"); tmp.innerHTML = plannerPanel(sq); const nb = tmp.querySelector("#rulefound"); if (nb) box.innerHTML = nb.innerHTML; } }
  if (e.target.id === "minsr"){ const v = $("#minsv"); if (v) v.textContent = e.target.value; }
  if (e.target.id === "plq"){ state.pl.q = e.target.value; state.pl.limit = 50; const s = SORTS[state.pl.sort], list = filtered(state.pl).sort((a,b) => s[1](b) - s[1](a));
    $("#pllist").innerHTML = listHtml(list); const pc = $("#plcount"); if (pc) pc.textContent = `${list.length} players`; const m = document.querySelector("[data-more]"); if (m) m.hidden = list.length <= state.pl.limit; }
  if (e.target.id === "bank"){ state.squad.bank = Math.max(0, parseFloat(e.target.value) || 0); saveSquad(); }
  if (e.target.id === "ft"){ state.squad.ft = Math.max(0, Math.min(5, parseInt(e.target.value) || 0)); saveSquad(); }
});
document.addEventListener("change", e => {
  if (e.target.dataset && e.target.dataset.sellsel){ const id = +e.target.dataset.sellsel; if (e.target.value) setRule("sell", id, +e.target.value); else { clearRule(id); saveRules(); } render(); }
  if (e.target.dataset && e.target.dataset.buysel){ const id = +e.target.dataset.buysel; if (e.target.value) setRule("buy", id, +e.target.value); else { clearRule(id); saveRules(); } render(); }
  if (e.target.dataset && e.target.dataset.chipsel){ RULES.chips[e.target.dataset.chipsel] = e.target.value === "off" || e.target.value === "auto" ? e.target.value : +e.target.value; saveRules(); render(); }
  if (e.target.id === "leaguesel"){ setLeague(+e.target.value); render(); }
  if (e.target.id === "importfile" && e.target.files && e.target.files[0]){ importSettings(e.target.files[0]); }
  if (e.target.id === "teamsortsel"){ state.teamSort = e.target.value; render(); }
  if (e.target.id === "h2ha" || e.target.id === "h2hb"){ state.h2h[e.target.id.slice(-1)] = +e.target.value; render(); }
  if (e.target.id === "plmax"){ state.pl.max = +e.target.value; render(); }
  if (e.target.id === "plsort"){ state.pl.sort = e.target.value; render(); }
  if (e.target.id === "bank" || e.target.id === "ft"){ state.plan = null; state.chipPlan = null; render(); }
  if (e.target.dataset && e.target.dataset.chip){ state.squad.chips[e.target.dataset.chip] = e.target.checked; saveSquad(); if (state.chipPlan) render(); }
});
window.addEventListener("hashchange", () => { render(); window.scrollTo(0, 0); });
loadLive(); registerApp();
document.addEventListener("click", e => { const a = e.target.closest("nav.tabs a"); if (a && a.getAttribute("href") === (location.hash || "#week")){ e.preventDefault(); window.scrollTo({top: 0, behavior: "smooth"}); } });

/* ---------- boot ---------- */
function start(data){
  prep(data);
  const ko = D.meta.first_kickoff;
  $("#deadline").innerHTML = `<b>GW${GWS[0]}</b>${ko ? "first kick-off " + dayTime(ko) : ""}`;
  $("#dataNote").textContent = `Built on every match and shot up to GW${D.meta.last_gw}. Updated ${dayTime(D.meta.generated)}.`;
  const pend = (D.meta.pending || []).filter(f => T[f.h] && T[f.a]);
  if (pend.length) $("#pendingNote").innerHTML = `<p class="pending">Still to play from GW${pend[0].gw}: ${pend.map(f => `${esc(T[f.h].name)} v ${esc(T[f.a].name)}${f.ko ? ", " + dayTime(f.ko) : ""}`).join("; ")}. The numbers refresh once it’s in.</p>`;
  if (!location.hash || location.hash === "#gameweek") history.replaceState(null, "", "#week");
  render();
}
if (window.FPL_DATA) start(window.FPL_DATA);
else fetch("data.json", {cache:"no-store"}).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); }).then(start)
  .catch(() => { $("#view").innerHTML = `<div class="error"><p class="name">The data file didn’t load.</p><p class="lede">Check that data.json sits next to index.html, or run the update workflow to create it.</p></div>`; });
})();
</script>
</body>
