function bestXI(players, i, get){
  if (get){ const shadow = players.map(p => Object.assign(Object.create(p), {ep: {[i]: get(p, i)}, orig: p})); const r = bestXI(shadow, i);
    const un = x => x && x.orig; return {...r, xi: r.xi.map(un), bench: r.bench.map(un), cap: un(r.cap), vice: un(r.vice)}; }
  const by = pos => players.filter(p => p.pos === pos).sort((a,b) => b.ep[i]-a.ep[i]);
  const gk = by(1), df = by(2), md = by(3), fw = by(4);
  const xi = [...gk.slice(0,1), ...df.slice(0,3), ...md.slice(0,2), ...fw.slice(0,1)];
  const rest = [...df.slice(3), ...md.slice(2), ...fw.slice(1)].sort((a,b) => b.ep[i]-a.ep[i]);
  const cap = {2:5,3:5,4:3}, count = {2:3,3:2,4:1};
  for (const p of rest){ if (xi.length >= 11) break; if (count[p.pos] < cap[p.pos]){ xi.push(p); count[p.pos]++; } }
  const bench = players.filter(p => !xi.includes(p)).sort((a,b) => (b.pos===1) - (a.pos===1) || b.ep[i]-a.ep[i]);
  const sorted = [...xi].sort((a,b) => b.ep[i]-a.ep[i]);
  const xiSum = xi.reduce((s,p) => s + p.ep[i], 0);
  return {xi: xi.sort((a,b) => a.pos-b.pos || b.ep[i]-a.ep[i]), bench, cap: sorted[0], vice: sorted[1], xiSum,
    benchSum: bench.reduce((s,p) => s + p.ep[i], 0), total: xiSum + (sorted[0] ? sorted[0].ep[i] : 0)};
}
const horizon = (pl, from = 0) => { let s = 0; for (let i = from; i < GWS.length; i++) s += bestXI(pl, i).total; return s; };
const clubOk = (squad, p, without) => squad.filter(x => x !== without && x.t === p.t).length < 3;
function candidates(pos, budget, exclude, from = 0, n = 14){
  const v = p => p.ep.slice(from).reduce((a,b) => a + b, 0);
  return D.players.filter(p => p.pos === pos && available(p) && !exclude.has(p.id) && p.price <= budget + 1e-9 && !(typeof RULES !== "undefined" && RULES.ban.includes(p.id))).sort((a,b) => v(b) - v(a)).slice(0, n);
}
function bestSingle(squad, bank, from){
  const base = horizon(squad, from), ids = new Set(squad.map(p => p.id)); let best = null;
  for (const o of squad){
    for (const c of candidates(o.pos, o.price + bank, ids, from)){
      if (!clubOk(squad, c, o)) continue;
      const next = squad.map(p => p === o ? c : p), gain = horizon(next, from) - base;
      if (!best || gain > best.gain) best = {o, c, gain, squad: next, bank: bank + o.price - c.price};
    }

function transferIdeas(squad){
  if (squad.length !== 15) return [];
  const base = horizon(squad), ids = new Set(squad.map(p => p.id)), out = [];
  for (const o of squad.filter(x => !RULES.lock.includes(x.id))) candidates(o.pos, o.price + Number(state.squad.bank || 0), ids, 0, 20).forEach(c => {
    if (!clubOk(squad, c, o)) return; const gain = horizon(squad.map(p => p === o ? c : p)) - base; if (gain > 0.3) out.push({o, c, gain}); });
  out.sort((a,b) => b.gain - a.gain);
  const seen = new Set(), picks = [];
  for (const x of out){ if (seen.has(x.o.id) || seen.has("c" + x.c.id)) continue; seen.add(x.o.id); seen.add("c" + x.c.id); picks.push(x); if (picks.length === 5) break; }

}

      const roll = {squad: st.squad, bank: st.bank, ft: Math.min(5, st.ft + 1), score: st.score + bestXI(st.squad, i).total,
        steps: [...st.steps, {gw: GWS[i], moves: [], hit: 0, ft: st.ft}]};

          s1.est = s1.score + horizon(one.squad, i + 1); next.push(s1);
          const two = bestSingle(one.squad, one.bank, i);
          const hit2 = st.ft >= 2 ? 0 : st.ft === 1 ? 4 : 8;

// Best squad under a budget for the given gameweeks (Wildcard and Free Hit). Greedy start, then improving swaps.
function optimiseSquad(budget, idxs, get){

  const val = p => idxs.reduce((s,i) => s + get(p, i), 0);
  const pool = {}; [1,2,3,4].forEach(pos => pool[pos] = D.players.filter(p => p.pos === pos && available(p)).sort((a,b) => val(b) - val(a)).slice(0, 45));
  const cheapest = {}; [1,2,3,4].forEach(pos => cheapest[pos] = Math.min(...D.players.filter(p => p.pos === pos && available(p)).map(p => p.price)));
  let squad = [], spent = 0;
  const need = () => [1,2,3,4].reduce((s,pos) => s + (LIMIT[pos] - squad.filter(p => p.pos === pos).length) * cheapest[pos], 0);
  const order = [1,2,3,4].flatMap(pos => pool[pos]).sort((a,b) => val(b) / Math.sqrt(b.price) - val(a) / Math.sqrt(a.price));
  for (const p of order){
    if (squad.length === 15) break;
    if (squad.filter(x => x.pos === p.pos).length >= LIMIT[p.pos] || !clubOk(squad, p)) continue;
    const left = need() - cheapest[p.pos];
    if (spent + p.price + left <= budget + 1e-9){ squad.push(p); spent += p.price; }
  }
  [1,2,3,4].forEach(pos => { while (squad.filter(x => x.pos === pos).length < LIMIT[pos]){
    const c = D.players.filter(p => p.pos === pos && available(p) && !squad.includes(p) && clubOk(squad, p)).sort((a,b) => a.price - b.price || val(b) - val(a))[0];
    squad.push(c); spent += c.price; } });
  const score = sq => idxs.reduce((s,i) => s + bestXI(sq, i, get).total, 0);
  let cur = score(squad);
  for (let it = 0; it < 40; it++){
    let best = null;
    for (const o of squad) for (const c of pool[o.pos]){
      if (squad.includes(c) || spent - o.price + c.price > budget + 1e-9 || !clubOk(squad, c, o)) continue;
      const sq = squad.map(p => p === o ? c : p), s = score(sq);
      if (s > cur + 0.05 && (!best || s > best.s)) best = {sq, s, d: c.price - o.price};
    }
    if (!best) break;
    squad = best.sq; cur = best.s; spent += best.d;

}
function chipPlan(squad, plan){
  const half = GWS[0] <= D.meta.rules.chip_half_end ? D.meta.rules.chip_half_end : 38;
  const win = LONG.filter(g => g <= half), idx = g => LONG.indexOf(g);
  const sqAt = g => { let s = squad; if (plan) for (const st of plan.best.steps.filter(x => x.gw <= g)) for (const m of st.moves) s = s.map(p => p.id === m.o.id ? m.c : p); return s; };
  const budget = squad.reduce((s,p) => s + p.price, 0) + Number(state.squad.bank || 0);
  const tc = win.map(g => { const b = bestXI(sqAt(g), idx(g), epL); const c = b.cap; return {g, gain: c ? epL(c, idx(g)) : 0, p: c, haul: c && c.haul_long ? c.haul_long[idx(g)] || 0 : 0, dgw: !!(specialFor(g) && c && specialFor(g).doubles.includes(c.t))}; });
  const bb = win.map(g => ({g, gain: bestXI(sqAt(g), idx(g), epL).benchSum, dgw: !!(specialFor(g) && specialFor(g).doubles.length)}));
  const fhWeeks = win.filter((g, k) => k < GWS.length || specialFor(g));
  const fh = fhWeeks.map(g => { const i = idx(g), opt = optimiseSquad(budget, [i], epL); return {g, gain: opt.value - bestXI(sqAt(g), i, epL).total, blank: !!(specialFor(g) && specialFor(g).blanks.length)}; });
  const wc = optimiseSquad(budget, GWS.map((g,i) => i));
  const best = (arr, f = x => x.gain) => [...arr].sort((a,b) => f(b) - f(a))[0];
  return {half, win, tc, bb, fh, wc: {gain: wc.value - horizon(squad), squad: wc.squad},
    tcBest: best(tc, x => x.gain + 6 * x.haul), bbBest: best(bb), fhBest: best(fh)};
}

}

function addToSquad(id){
  const p = P[id], ids = state.squad.ids;
  if (ids.includes(id)) return true;
  if (ids.filter(x => P[x].pos === p.pos).length >= LIMIT[p.pos]){ toast(`Your squad already has ${LIMIT[p.pos]} ${POS_LONG[p.pos]}s. Remove one first.`); return false; }
  if (ids.filter(x => P[x].t === p.t).length >= 3){ toast(`You already have 3 players from ${T[p.t].name}.`); return false; }
  ids.push(id); state.plan = null; state.chipPlan = null; saveSquad(); toast(`${p.n} added to your squad`); return true;
}
function removeFromSquad(id){ state.squad.ids = state.squad.ids.filter(x => x !== id); state.plan = null; state.chipPlan = null; saveSquad(); toast(`${P[id].n} removed`); }

/* ---------- model ---------- */
const SOURCE_ROLE = {
  "ClubElo ratings": "Part of each team’s starting rating. Elo updates after every result, so it’s current-season information.",
  "Bookmaker odds for the next round": "The biggest current-season input for the coming gameweek: 60% of each team’s expected goals.",
  "Referee appointments for the next round": "Small effect: penalty and card chances for the first-choice taker.",
  "Understat (second opinion)": "Display only: a second set of xG figures on player pages. It doesn’t change any projection.",
};
function seasonShare(){
  const n = D.meta.last_gw || 0, eff = (1 - Math.pow(0.95, n)) / 0.05, prior = 4;
  return n ? eff / (eff + prior) : 0;
}
function sourcesList(){
  const S = D.meta.sources || {}, N = D.meta.source_notes || {};
  const share = seasonShare();
  return `<div class="seasonbar"><div class="head"><b>Where team ratings come from right now</b><span>${pct(share)} this season</span></div>
      <div class="sbar"><i style="width:${100 * share}%"></i></div>
      <p class="sub">After ${D.meta.last_gw} gameweeks, ${pct(share)} of each team’s rating comes from this season’s matches and ${pct(1 - share)} from its starting point (last season, pulled a third of the way to average, blended with ClubElo when available). The starting point fades every week: about 76% this season by GW19 and 80% by the end. Tested on this season’s matches, this weighting predicted better than relying on this season alone. Players’ roles work the same way; for the coming gameweek, FPL’s own projection (${D.meta.lab ? Math.round(100 * D.meta.lab.w_fpl) : 0}% of Lab points) and bookmaker odds (60% of team expected goals) are current-season too.</p></div>
    ${D.meta.checks ? `<div class="checks"><b>${D.meta.checks.failed && D.meta.checks.failed.length ? "Some checks failed" : "Safety checks passed"}</b><span class="sub"> Every update is checked before it goes live; if anything looks wrong, yesterday’s numbers stay up and GitHub emails you.</span>
      <ul>${(D.meta.checks.passed || []).map(x => `<li>✓ ${esc(x)}</li>`).join("")}${(D.meta.checks.failed || []).map(x => `<li class="bad">✗ ${esc(x)}</li>`).join("")}</ul></div>` : ""}
    <ul class="health">${Object.entries(S).map(([k, v]) => `<li>${toneDot(v ? "up" : "flat")}<span>${esc(k)}${v ? "" : ": not used this run"}${!v && N[k] ? `<small class="srcwhy">Why: ${esc(N[k])}</small>` : v && N[k] ? `<small class="srcrole">Note: ${esc(N[k])}</small>` : ""}${!v && SOURCE_ROLE[k] ? `<small class="srcrole">${esc(SOURCE_ROLE[k])}</small>` : ""}</span></li>`).join("")}</ul>
    <p class="sub">Anything “not used this run” was unreachable or not yet published; the model carries on without it and picks it up next time.</p>
    <p class="sub"><b>Switched off after testing:</b> ClubElo (an Elo rating built from every result since August 2025 made this season’s predictions slightly worse, because results are noisier than expected goals) and Understat (its site now blocks automated requests from GitHub, and it only ever supplied second-opinion figures on player pages, never the projections).</p>`;
}
function labModel(){
  const L = D.meta.lab, P0 = D.accuracy_prev && D.accuracy_prev.summary;
  if (!L) return "";
  const ks = Object.keys(L.cap).map(Number).sort((a,b) => a - b), mx = Math.max(...ks.map(k => L.cap[k]));
  return `<h3>The FPL Lab score</h3><p class="verdict">Our own points system, learned from <b>${L.gws} past gameweeks</b> (${L.n.toLocaleString("en-GB")} player projections). Lab points blend the model with FPL’s figure ${pct(1 - L.w_fpl)} to ${pct(L.w_fpl)}. ${L.kappa ? `The captain score adds <b>${L.kappa} × expected goal involvements</b>, the setting whose pick scored most.` : "For captains, plain Lab points picked best; adding a bonus for goal involvements didn’t help."}</p>
  <dl class="kv"><dt>Average error: model alone</dt><dd>${f2(L.mae_model)}</dd><dt>Average error: Lab points</dt><dd>${f2(L.mae_lab)}</dd><dt>Average error: FPL’s projections</dt><dd>${f2(L.mae_fpl)}</dd></dl>
  <h3>Captain picks by setting</h3><p class="lede">Average actual points of the top-ranked captain each gameweek. The best possible pick averaged ${f1(L.cap_best)}; FPL’s top pick averaged ${f1(L.cap_fpl)}.</p>
  <div class="bd">${ks.map(k => `<span class="sub">${k === 0 ? "Expected points only" : `+ ${k} × xGI`}</span><div><div class="bar" style="width:${Math.max(4, 100 * L.cap[k] / mx)}%;${k === L.kappa ? "background:var(--up)" : ""}"></div></div><b>${f1(L.cap[k])}</b>`).join("")}</div>
  ${P0 && P0.gws ? `<h3>Last season’s backtest</h3><p class="lede">The same model re-run before every gameweek of 2025/26 from GW${P0.gws[0]}: closer to actual points than FPL’s projections in <b>${P0.wins} of ${P0.n}</b> gameweeks, average error ${f2(P0.mae)} against ${f2(P0.mae_fpl)}, captain average ${f1(P0.cap)} against ${f1(P0.cap_fpl)}.</p>` : ""}`;
}
function viewModel(){
  const A = D.accuracy, s = A && A.summary, L = D.live || {weeks: []};
  const how = `<h3>How the projections work</h3><ol class="steps">
    <li><b>Team ratings.</b> Attack and defence from expected goals for and against, weighted towards recent matches and adjusted for the opponents faced. A quarter of the weight goes to real goals.</li>
    <li><b>Fixture forecast.</b> Every upcoming match gets an expected-goals figure for both teams, including home advantage. Clean sheet chances come from those numbers.</li>
    <li><b>Player share.</b> A player’s expected goals and assists are his share of his team’s total when he’s on the pitch, shrunk towards his position’s average until there’s enough data.</li>
    <li><b>Style matchup.</b> Every shot is tagged by zone, body part and situation. His shot profile is crossed with what the opponent concedes in each area, moving his expected goals by up to 15%.</li>
    <li><b>Minutes, news and rotation.</b> Expected minutes come from his last five league matches. Injury flags scale everything down, and a cup or European game either side cuts his start chance in line with how often he’s been rested before.</li>
    <li><b>Starting points.</b> Last season’s data gives every returning player and team a starting point, and ClubElo rates promoted sides, so early weeks and new arrivals aren’t judged on a handful of matches.</li>
    <li><b>Recent form.</b> Team ratings weight recent matches more, with a half-life of about 13 gameweeks. Tested on ${D.meta.form_test ? D.meta.form_test.matches : 370} matches, leaning harder on the last four games, or adding a separate form boost, predicted goals worse, so the projections don’t. Adjusted xP shows the what-if instead.</li>
    <li><b>Penalties.</b> A player’s share of his team’s chances leaves penalties out. Each team’s expected penalties go only to its current first-choice taker, so a player who has lost penalty duties drops straight away.</li>
    <li><b>Home and away.</b> Home sides create ${pct(D.meta.home_adv)} more on average, and every fixture gets that boost. Each team’s own home and away record is shown as context in every explanation, but it isn’t used to adjust the numbers: tested on ${D.meta.venue ? D.meta.venue.matches : "past"} matches, team-specific splits predicted goals worse than ignoring them, because a handful of games at one venue is mostly noise.</li>
    <li><b>Market and referee.</b> Bookmaker odds are turned into expected goals and blended in at the weight that best predicted goals in past seasons’ closing odds. The appointed referee’s penalty rate adds penalty xG to the designated taker.</li>
    <li><b>Points and range.</b> Everything converts to FPL points. Each player’s week is then simulated ${D.meta.sims.toLocaleString("en-GB")} times to get his chance of a haul or a blank.</li>
    <li><b>The Lab score.</b> Finally the model’s figure is blended with FPL’s own, and the captain score adds a bonus for goal involvements. Both settings are learned from the backtests, not chosen by hand.</li></ol>`;
  const live = L.weeks && L.weeks.length ? (() => { const ls = L.summary;
    return `<p class="verdict">On real pre-deadline forecasts, the model has been closer than FPL in <b>${ls.wins} of ${ls.n}</b> gameweeks. Average error ${f2(ls.mae)} against FPL’s ${f2(ls.mae_fpl)}; captain average ${f1(ls.cap)} against ${f1(ls.cap_fpl)}.</p>
    <div class="scroller"><table class="log"><thead><tr><th>GW</th><th class="n">Error</th><th class="n">FPL</th><th class="n">GK</th><th class="n">DEF</th><th class="n">MID</th><th class="n">FWD</th><th>Captain</th></tr></thead>
    <tbody>${L.weeks.map(w => `<tr><td>${w.gw}</td><td class="n">${f2(w.mae)}</td><td class="n">${f2(w.mae_fpl)}</td>${[1,2,3,4].map(k => `<td class="n">${w.by_pos[k] ? f2(w.by_pos[k][0]) : "–"}</td>`).join("")}<td>${esc(w.cap.n)} ${w.cap.pts}</td></tr>`).join("")}</tbody></table></div>`; })()
    : `<p class="lede">The live log saves the model’s projections before every deadline and scores them once the gameweek is played, so nothing is re-run with hindsight. Recording started with GW${GWS[0]}; the first result appears after it finishes.</p>`;
  if (!s || !s.gws) return `<h2>Model</h2><h3>Live record</h3>${live}${how}${glossaryList()}`;
  const W = A.weeks, maxM = Math.max(...W.flatMap(w => [w.mae, w.mae_fpl])) * 1.1, bw = 300 / W.length;
  const bars = W.map((w,i) => { const x = 30 + i * bw, h1 = 120 * w.mae / maxM, h2 = 120 * w.mae_fpl / maxM;
    return `<rect class="ours" x="${x + bw*0.18}" y="${140 - h1}" width="${bw*0.3}" height="${h1}" rx="1.5"/><rect class="fpl" x="${x + bw*0.52}" y="${140 - h2}" width="${bw*0.3}" height="${h2}" rx="1.5"/><text x="${x + bw/2}" y="152" text-anchor="middle">GW${w.gw}</text>`; }).join("");
  const C = A.calibration, cmax = Math.max(6, ...C.map(c => Math.max(c.proj, c.actual)));
  const sx = v => 30 + 270 * v / cmax, sy = v => 150 - 130 * v / cmax;
  const cal = `<line x1="${sx(0)}" y1="${sy(0)}" x2="${sx(cmax)}" y2="${sy(cmax)}" style="stroke:var(--chalk);stroke-dasharray:3 3"/>${C.map(c => `<circle cx="${sx(c.proj)}" cy="${sy(c.actual)}" r="${Math.max(3, Math.min(9, Math.sqrt(c.n) / 4))}" class="ours" opacity=".85"/>`).join("")}
    ${[0,2,4,6].filter(v => v <= cmax).map(v => `<text x="${sx(v)}" y="164" text-anchor="middle">${v}</text><text x="22" y="${sy(v)+3}" text-anchor="end">${v}</text>`).join("")}`;
  const last = W[W.length - 1], posAvg = k => { const v = W.filter(w => w.by_pos[k]); return v.length ? [v.reduce((a,w) => a + w.by_pos[k][0], 0) / v.length, v.reduce((a,w) => a + w.by_pos[k][1], 0) / v.length] : null; };
  return `<h2>Model accuracy</h2>
  ${labModel()}
  <h3>Live record</h3>${live}
  <h3>Backtest</h3><p class="verdict">Re-running the model as it stood before each gameweek from GW${s.gws[0]} to GW${s.gws[1]}, it was <b>closer to actual points than FPL’s own projections in ${s.wins} of ${s.n} gameweeks</b>. Its captain pick averaged <b>${f1(s.cap)} points</b>, against ${f1(s.cap_fpl)} for FPL’s.</p>
  <div class="stats"><div class="stat"><b>${f2(s.mae)}</b><span>Average error, points</span><em>FPL: ${f2(s.mae_fpl)}</em></div><div class="stat"><b>${f2(s.corr)}</b><span>Rank correlation</span><em>FPL: ${f2(s.corr_fpl)}</em></div><div class="stat"><b>${f1(s.top10)}</b><span>Top-10 picks, avg pts</span><em>FPL: ${f1(s.top10_fpl)}</em></div></div>
  <p class="sub">Average error is the typical gap between projected and actual points for everyone either source expected to feature; lower is better. Rank correlation (0 to 1) checks the order among players who played; higher is better.</p>
  <h3>Error by position</h3><dl class="kv">${[1,2,3,4].map(k => { const a = posAvg(k); return a ? `<dt>${POS_LONG[k][0].toUpperCase() + POS_LONG[k].slice(1)}s</dt><dd>${f2(a[0])} <span class="sub">FPL ${f2(a[1])}</span></dd>` : ""; }).join("")}</dl>
  <h3>Error by gameweek</h3><span class="lk"><i style="background:var(--me)"></i>FPL Lab</span><span class="lk"><i style="background:var(--chalk)"></i>FPL’s expected points</span>
  <svg class="chart" viewBox="0 0 340 160" role="img" aria-label="Average error by gameweek">${bars}<line x1="30" y1="140" x2="330" y2="140" style="stroke:var(--line)"/></svg>
  <h3>Is it calibrated?</h3><p class="lede">Each dot groups players by projected points (across) and shows what they actually scored on average (up). On the dashed line means right on average; bigger dots hold more players.</p>
  <svg class="chart" viewBox="0 0 320 172" role="img" aria-label="Projected versus actual points">${cal}<text x="165" y="171" text-anchor="middle">Projected points</text></svg>
  <h3>Captain log</h3><div class="scroller"><table class="log"><thead><tr><th>GW</th><th>FPL Lab</th><th class="n">Pts</th><th>FPL’s pick</th><th class="n">Pts</th><th>Top scorer</th><th class="n">Pts</th></tr></thead>
  <tbody>${W.map(w => `<tr><td>${w.gw}</td><td>${esc(w.cap.n)}</td><td class="n">${w.cap.pts}</td><td>${w.cap_fpl ? esc(w.cap_fpl.n) : "–"}</td><td class="n">${w.cap_fpl ? w.cap_fpl.pts : "–"}</td><td>${esc(w.best.n)}</td><td class="n">${w.best.pts}</td></tr>`).join("")}</tbody></table></div>
  <h3>Biggest misses in GW${last.gw}</h3><dl class="kv">${last.under.map(m => `<dt>${esc(m.n)} scored more than expected</dt><dd>${m.proj} → ${m.pts}</dd>`).join("")}${last.over.map(m => `<dt>${esc(m.n)} scored less than expected</dt><dd>${m.proj} → ${m.pts}</dd>`).join("")}</dl>
  ${how}${wholeAppViews()}${backupHtml()}${glossaryList()}<h3>Data sources this run</h3>${sourcesList()}<p class="lede">${esc(D.meta.source)}. ${D.meta.matches} league matches, every shot in them, and cup and European minutes feed the model. Rebuilt ${dayTime(D.meta.generated)}.</p>`;
}

function openPlayer(id){
  const p = P[id], n = p.next, s = p.season || {}, inSquad = state.squad.ids.includes(id), inCmp = state.compare.includes(id);
  const labels = {app:"Appearance",goals:"Goals",assists:"Assists",cs:"Clean sheet",gc:"Goals conceded",saves:"Saves",defcon:"DEFCON",bonus:"Bonus",cards:"Cards"};

  const bd = n ? Object.entries(n.breakdown).filter(([k,v]) => Math.abs(v) >= 0.05).sort((a,b) => b[1]-a[1]) : [];
  const bmax = Math.max(0.1, ...bd.map(([,v]) => Math.abs(v)));

    .filter(([k]) => p.pct && p.pct[k] != null && (k !== "dc90" || p.pos > 1));

  const matchup = n && p.prof && opp && opp.prof.def.six ? `<h3>Matchup map</h3><p class="lede">Left: where ${esc(p.n)}’s non-penalty xG comes from. Right: where ${esc(opp.name)} concede, as a multiple of the league average.</p>

    <div class="trio">${SIT.map(c => `<div>${D.meta.cats[c]}<b>${pct(p.prof[c])}</b>of his xG, ${esc(opp.short)} concede ${opp.prof.def[c][1].toFixed(1)}×</div>`).join("")}</div><div class="keyline"><i></i> Less than league average, average, more</div>` : "";
  const range = p.sim ? `<h3>Range of outcomes</h3><p class="sub">${term("haul", "Haul chance")} and ${term("blank", "blank chance")}, explained.</p><p class="lede">GW${GWS[0]} played ${D.meta.sims.toLocaleString("en-GB")} times. Numbers above the bars are the percentage chance of each total.</p>${histogram(p.sim)}
    <div class="mini"><span class="up">${pct(p.sim.haul)} chance of 10+</span><span>${pct(p.sim.ret)} chance of 4+</span><span class="down">${pct(p.sim.blank)} chance of 2 or fewer</span><span>Middle 80%: ${p.sim.q[0]} to ${p.sim.q[2]}</span></div>
    <h3>Ownership effect</h3><dl class="kv"><dt>Owned by</dt><dd>${f1(p.own)}%</dd><dt>Points gained on the field if you own him</dt><dd>${f1(p.ep[0] * (1 - own(p)))}</dd><dt>Points lost to the field if you don’t</dt><dd>${f1(p.ep[0] * own(p))}</dd></dl>

  const luck = s.mins >= 270 ? `<h3>Luck check</h3><dl class="kv"><dt>Goals vs xG</dt><dd>${s.goals} vs ${f1(s.xg_total)} (${sgn(s.goals - s.xg_total)})</dd><dt>Assists vs xA</dt><dd>${s.assists} vs ${f1(s.xa_total)} (${sgn(s.assists - s.xa_total)})</dd>
    ${s.xgot_total ? `<dt>Shot placement (xG on target minus xG)</dt><dd>${sgn(s.xgot_total - s.xg_total)}</dd>` : ""}${p.pos === 1 ? `<dt>Goals prevented</dt><dd>${sgn(s.gp_total)}</dd>` : ""}</dl>
    <p class="sub">Gaps between goals and xG tend to shrink, so the model projects from xG. Positive shot placement is the most repeatable sign of a good finisher.</p>` : "";
  const rot = p.rot ? `<h3>Rotation record</h3><dl class="kv"><dt>League starts after a cup or European game</dt><dd>${p.rot.s_c} of ${p.rot.n_c}</dd><dt>Other league starts</dt><dd>${p.rot.s_n} of ${p.rot.n_n}</dd>

// FPL Lab exact transfer solver: a mixed-integer programme solved with HiGHS.
// Plans up to H gameweeks: squad, starting XI, captain, transfers, banked free transfers, hits and chips.
function buildLP(opts){
  const {players, squadIds, bank, ft, H, epAt, capAt = epAt, decay = 0.9, benchW = 0.1, ftValue = 1.5, maxTransfersPerGW = 3, hitCost = 4, pool = 22,
    banned = [], forced = [], buyBy = [], sellBy = [], maxTransfers = null, maxHits = null,
    chips = {}, sellPrice = {}, exclude = []} = opts;
  // banned: never in the squad (owned players are sold in week one); forced: in the squad every week;
  // buyBy / sellBy: [{id, t}] in the squad, or gone, from week t onwards;
  // chips: {wc|fh|bb|tc: "auto" | week index | undefined}; sellPrice: {id: £m} for players already owned;
  // exclude: first-week move sets to rule out, for finding alternative plans
  const inSquad = new Set(squadIds);
  const val = p => { let s = 0; for (let t = 0; t < H; t++) s += epAt(p, t); return s; };
  const byPos = {1:[],2:[],3:[],4:[]};
  players.forEach(p => { if (p.pos && byPos[p.pos]) byPos[p.pos].push(p); });
  const keep = new Set(squadIds);
  const extra = (chips.wc != null || chips.fh != null) ? 6 : 0;
  for (const pos of [1,2,3,4]) byPos[pos].filter(p => p.st !== "u" && !banned.includes(p.id)).sort((a,b) => val(b) - val(a)).slice(0, pos === 1 ? 8 : pool + extra).forEach(p => keep.add(p.id));
  forced.forEach(id => keep.add(id)); buyBy.forEach(r => keep.add(r.id));
  const P = players.filter(p => keep.has(p.id));
  const teams = [...new Set(P.map(p => p.t))];
  const v = (n, i, t) => `${n}_${i}_${t}`;
  const obj = [], cons = [], bins = [], gens = [], bounds = [];
  let ci = 0; const C = s => cons.push(` c${ci++}: ${s}`);
  const T = H;
  const use = k => chips[k] != null;
  const fixedAt = k => typeof chips[k] === "number" ? chips[k] : null;
  const sp = p => (inSquad.has(p.id) && sellPrice[p.id] != null) ? sellPrice[p.id] : p.price;
  P.forEach((p, i) => {
    for (let t = 0; t < T; t++){
      const w = Math.pow(decay, t), ep = epAt(p, t);
      // each variable appears once in the objective (the LP reader does not add up repeats)
      obj.push(`+ ${(w * ep * (1 - benchW)).toFixed(4)} ${v("x", i, t)}`, `+ ${(w * capAt(p, t)).toFixed(4)} ${v("c", i, t)}`, `+ ${(w * ep * benchW).toFixed(4)} ${v("s", i, t)}`);
      ["s","x","c","b","q"].forEach(n => bins.push(v(n, i, t)));
      if (use("fh")){ C(`${v("x", i, t)} - ${v("s", i, t)} - fh_${t} <= 0`); C(`${v("x", i, t)} - ${v("f", i, t)} + fh_${t} <= 1`); C(`${v("f", i, t)} - fh_${t} <= 0`); bins.push(v("f", i, t));
        C(`${v("b", i, t)} + fh_${t} <= 1`); C(`${v("q", i, t)} + fh_${t} <= 1`); }
      else C(`${v("x", i, t)} - ${v("s", i, t)} <= 0`);
      C(`${v("c", i, t)} - ${v("x", i, t)} <= 0`);
      if (use("tc")){ obj.push(`+ ${(w * ep).toFixed(4)} ${v("k", i, t)}`); bins.push(v("k", i, t)); C(`${v("k", i, t)} - ${v("c", i, t)} <= 0`); C(`${v("k", i, t)} - tc_${t} <= 0`); }
      if (use("bb")){ obj.push(`+ ${(w * ep * (1 - benchW)).toFixed(4)} ${v("y", i, t)}`); bins.push(v("y", i, t)); C(`${v("y", i, t)} - ${v("s", i, t)} <= 0`); C(`${v("y", i, t)} + ${v("x", i, t)} <= 1`); C(`${v("y", i, t)} - bb_${t} <= 0`); }
      const prev = t === 0 ? (inSquad.has(p.id) ? 1 : 0) : null;
      if (t === 0) C(`${v("s", i, t)} - ${v("b", i, t)} + ${v("q", i, t)} = ${prev}`);
      else C(`${v("s", i, t)} - ${v("s", i, t - 1)} - ${v("b", i, t)} + ${v("q", i, t)} = 0`);
      if (banned.includes(p.id)){ C(`${v("s", i, t)} = 0`); if (use("fh")) C(`${v("f", i, t)} = 0`); }
      if (forced.includes(p.id)) C(`${v("s", i, t)} = 1`);
      if (buyBy.some(r => r.id === p.id && t >= r.t)) C(`${v("s", i, t)} = 1`);
      if (sellBy.some(r => r.id === p.id && t >= r.t)) C(`${v("s", i, t)} = 0`);
      if (p.st === "u") C(`${v("b", i, t)} = 0`);
      C(`${v("b", i, t)} + ${v("q", i, t)} <= 1`);
    }
  });
  const sum = (t, n, f = () => true, coef = () => 1) => P.map((p, i) => f(p) ? `+ ${coef(p)} ${v(n, i, t)}` : "").filter(Boolean).join(" ");
  const lim = {1:2,2:5,3:5,4:3};
  for (let t = 0; t < T; t++){
    C(`${sum(t, "s")} = 15`);
    for (const pos of [1,2,3,4]) C(`${sum(t, "s", p => p.pos === pos)} = ${lim[pos]}`);
    C(`${sum(t, "x")} = 11`);
    C(`${sum(t, "x", p => p.pos === 1)} = 1`);
    C(`${sum(t, "x", p => p.pos === 2)} >= 3`); C(`${sum(t, "x", p => p.pos === 2)} <= 5`);
    C(`${sum(t, "x", p => p.pos === 3)} >= 2`); C(`${sum(t, "x", p => p.pos === 3)} <= 5`);
    C(`${sum(t, "x", p => p.pos === 4)} >= 1`); C(`${sum(t, "x", p => p.pos === 4)} <= 3`);
    C(`${sum(t, "c")} = 1`);
    for (const tm of teams) C(`${sum(t, "s", p => p.t === tm)} <= 3`);
    if (use("fh")){
      C(`${sum(t, "f")} - 15 fh_${t} = 0`);
      for (const pos of [1,2,3,4]) C(`${sum(t, "f", p => p.pos === pos)} - ${lim[pos]} fh_${t} = 0`);
      for (const tm of teams) C(`${sum(t, "f", p => p.t === tm)} <= 3`);
      // a one-week squad can cost no more than the current squad's value plus the bank
      C(`${sum(t, "f", () => true, p => p.price)} ${P.map((p, i) => `- ${sp(p)} ${v("s", i, t)}`).join(" ")} - bank_${t} + 300 fh_${t} <= 300`);
    }
    // bank: money in minus money out, never negative
    const flows = P.map((p, i) => `- ${sp(p)} ${v("q", i, t)} + ${p.price} ${v("b", i, t)}`).join(" ");
    if (t === 0) C(`bank_${t} ${flows} = ${bank}`);
    else C(`bank_${t} - bank_${t - 1} ${flows} = 0`);
    bounds.push(`bank_${t} >= 0`);
    // transfers, free transfers, hits and the transfer chips
    C(`n_${t} ${sum(t, "b").replace(/\+ 1 /g, "- ")} = 0`);
    C(`n_${t} ${use("wc") ? `- 12 wc_${t}` : ""} <= ${maxTransfersPerGW}`);
    C(`u_${t} - n_${t} <= 0`); C(`u_${t} - ft_${t} <= 0`);
    if (use("wc") || use("fh")) C(`u_${t} ${use("wc") ? `+ 5 wc_${t}` : ""} ${use("fh") ? `+ 5 fh_${t}` : ""} <= 5`);
    C(`h_${t} - n_${t} + u_${t} ${use("wc") ? `+ 15 wc_${t}` : ""} >= 0`);
    C(`h_${t} - 15 z_${t} <= 0`); C(`u_${t} - ft_${t} - 5 z_${t} >= -5`);
    C(`ft_${t + 1} - ft_${t} + u_${t} <= 1`);
    bounds.push(`1 <= ft_${t + 1} <= 5`, `0 <= n_${t} <= 15`, `0 <= u_${t} <= 5`, `0 <= h_${t} <= 15`);
    gens.push(`ft_${t + 1}`, `n_${t}`, `u_${t}`, `h_${t}`); bins.push(`z_${t}`);
    obj.push(`- ${(hitCost * Math.pow(decay, t)).toFixed(4)} h_${t}`);
    const on = ["wc","fh","bb","tc"].filter(use);
    on.forEach(k => bins.push(`${k}_${t}`));
    if (on.length > 1) C(`${on.map(k => `+ 1 ${k}_${t}`).join(" ")} <= 1`);
  }
  ["wc","fh","bb","tc"].filter(use).forEach(k => {
    const f = fixedAt(k);
    if (f != null && f < T) for (let t = 0; t < T; t++) C(`${k}_${t} = ${t === f ? 1 : 0}`);
    else C(`${Array.from({length: T}, (_, t) => `+ 1 ${k}_${t}`).join(" ")} <= 1`);
  });
  if (maxTransfers != null) C(`${Array.from({length: T}, (_, t) => `+ 1 n_${t}`).join(" ")} <= ${maxTransfers}`);
  if (maxHits != null) C(`${Array.from({length: T}, (_, t) => `+ 1 h_${t}`).join(" ")} <= ${maxHits}`);
  exclude.forEach(ex => {
    if (!ex.buys.length) C(`${sum(0, "b")} >= 1`);
    else { const idx = ex.buys.map(id => P.findIndex(p => p.id === id)).filter(i => i >= 0);
      if (idx.length) C(`${idx.map(i => `+ 1 ${v("b", i, 0)}`).join(" ")} <= ${idx.length - 1}`); }
  });
  C(`ft_0 = ${ft}`); bounds.push(`0 <= ft_0 <= 5`); gens.push("ft_0");
  obj.push(`+ ${ftValue} ft_${T}`);
  // the LP reader wants short lines, so wrap long expressions
  const wrap = str => str.split(" ").reduce((acc, tok) => { const last = acc[acc.length - 1];
    if (last.length > 180 && (tok === "+" || tok === "-")) acc.push(tok); else acc[acc.length - 1] = last ? last + " " + tok : tok; return acc; }, [""]).join("\n  ");
  const lp = `Maximize\n obj: ${wrap(obj.join(" "))}\nSubject To\n${cons.map(wrap).join("\n")}\nBounds\n ${bounds.join("\n ")}\nGeneral\n ${wrap(gens.join(" "))}\nBinary\n ${wrap(bins.join(" "))}\nEnd\n`;
  return {lp, P};
}
function readPlan(sol, P, H, epAt){
  const col = n => (sol.Columns[n] ? sol.Columns[n].Primal : 0);
  const steps = [];
  for (let t = 0; t < H; t++){
    const chip = ["wc","fh","bb","tc"].find(k => col(`${k}_${t}`) > 0.5) || null;
    const buys = P.filter((p, i) => col(`b_${i}_${t}`) > 0.5), sells = P.filter((p, i) => col(`q_${i}_${t}`) > 0.5);
    const xi = P.filter((p, i) => col(`x_${i}_${t}`) > 0.5), cap = P.find((p, i) => col(`c_${i}_${t}`) > 0.5);
    const squad = P.filter((p, i) => col(`s_${i}_${t}`) > 0.5), fhSquad = chip === "fh" ? P.filter((p, i) => col(`f_${i}_${t}`) > 0.5) : null;
    const bench = (fhSquad || squad).filter(p => !xi.includes(p));
    let pts = xi.reduce((s, p) => s + epAt(p, t), 0) + (cap ? epAt(cap, t) : 0);
    if (chip === "tc" && cap) pts += epAt(cap, t);
    if (chip === "bb") pts += bench.reduce((s, p) => s + epAt(p, t), 0);
    steps.push({t, buys, sells, xi, cap, squad, fhSquad, bench, chip, hits: Math.round(col(`h_${t}`)), ft: Math.round(col(`ft_${t}`)), bank: col(`bank_${t}`), pts});
  }
  return {steps, objective: sol.ObjectiveValue};
}

const GLOSSARY = {

  lab:["Lab points", "FPL Lab’s projected points.", ""],
  cap:["Lab captain score", "The captain ranking.", ""],
  haul:["Haul chance", "The chance of 10 or more points, from playing the gameweek 3,000 times in simulation.", "Useful for captaincy and for chasing rank, where ceiling matters more than the average."],
  blank:["Blank chance", "The chance of 2 points or fewer: an appearance and nothing else, or no minutes.", "A safe pick has a low blank chance; a risky one has a high one."],

  home:["Home advantage", "Home sides create about 18% more expected goals on average.", "Every fixture gets that boost. Each team’s own home and away record is shown for context but not used, because over a few games it’s mostly noise."],
  bonus:["Bonus points", "Up to 3 extra points for the best players in each match, based on FPL’s bonus points system.", "Goals, assists and clean sheets earn most of it, so bonus usually follows the players who return."],
  pct:["Percentile", "Where a player ranks among others in his position with at least 360 minutes. 90th means better than 90% of them.", "It turns raw numbers into context: 0.35 xG per 90 is elite for a defender but ordinary for a striker."],
  mae:["Average error", "The typical gap between projected and actual points for each player.", "Lower is better. It’s how the model is compared with FPL’s own projections."],
  rot:["Rotation risk", "The chance a player is rested because his team plays a cup or European game within a few days.", "Based on how often that player has actually been rested around those games this season."],

  adjxp:["If form continues", "A what-if: Lab points if a team’s last four games are the new normal. It takes how far the team has created above or below what its rating predicted over those games, and applies that to the player’s goals, assists and bonus only, not to minutes or clean sheets.", "Tested on 370 matches, leaning harder on the last four games made team predictions worse, so the main projection doesn’t do it. Use this when you believe something has genuinely changed, such as a new manager, formation or key signing."],

function minutesPoints(p, i, m){
  const full = p.epf ? p.epf[i] : null;
  if (full == null) return p.ep_orig ? p.ep_orig[i] : p.ep[i];
  if (!full) return 0;   // no fixture that week
  const p60 = Math.max(0, Math.min(1, (m - 30) / 45)), app = 2 * p60 + (m > 0 ? 1 - p60 : 0);
  return Math.max(0, app + Math.max(0, full - 2) * (m / 88));
}

const RADAR_KEYS = [["npxg90","npxG"],["xa90","xA"],["shots90","Shots"],["box90","Box"],["aerial90","Aerial"],["dc90","DEFCON"]];
function radar(players){

  if (keys.length < 3) return "";
  const cx = 110, cy = 105, R = 80, n = keys.length, ang = i => -Math.PI / 2 + 2 * Math.PI * i / n;

  const rings = [0.25, 0.5, 0.75, 1].map(f => `<polygon points="${keys.map((_, i) => pt(i, f).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="${f === 0.5 ? 1.2 : 0.8}"/>`).join("");
  const spokes = keys.map((_, i) => `<line x1="${cx}" y1="${cy}" x2="${pt(i, 1)[0]}" y2="${pt(i, 1)[1]}" stroke="var(--line)"/>`).join("");
  const labels = keys.map(([, l], i) => { const [x, y] = pt(i, 1.17); return `<text x="${x}" y="${y + 3}" text-anchor="middle">${l}</text>`; }).join("");
  const shapes = players.map((p, j) => `<polygon points="${keys.map(([k], i) => pt(i, ((p.pct || {})[k] || 0) / 100).join(",")).join(" ")}" fill="${cols[j]}" fill-opacity=".18" stroke="${cols[j]}" stroke-width="2"/>`).join("");

  const own = [...squad].sort((a,b) => a.pos - b.pos || b.ep6 - a.ep6).map(p => { const r = ruleFor(p.id);

      <button class="lockbtn" data-ruletoggle="lock" data-pid="${p.id}" aria-pressed="${!!(r && r.kind === "lock")}">${r && r.kind === "lock" ? "Locked" : "Lock"}</button>

  const others = [...RULES.buy.map(r => ({id: r.id, txt: "buy by GW" + r.gw})), ...RULES.ban.map(id => ({id, txt: "banned"}))].filter(x => P[x.id]);

    <div class="rules">
      <div class="head"><b>${esc(RULES.name)}: your squad</b><span class="sub">Lock to keep, or pick a week to sell by</span></div>

      <div id="rulefound">${found.map(p => { const r = ruleFor(p.id); return `<div class="rrow"><span class="rn">${dot(p.t)}<b>${esc(p.n)}</b> <span class="sub">${T[p.t].short} ${POS[p.pos]}, ${money(p.price)}</span></span>
        <label class="sellsel"><select data-buysel="${p.id}" aria-label="Buy ${esc(p.n)} by">${gwOpts(r && r.kind === "buy" ? r.gw : "", "Buy by…")}</select></label>
        <button class="lockbtn ban" data-ruletoggle="ban" data-pid="${p.id}" aria-pressed="${!!(r && r.kind === "ban")}">${r && r.kind === "ban" ? "Banned" : "Ban"}</button></div>`; }).join("")}</div>
      ${others.length ? `<div class="rulechips">${others.map(x => `<span class="rulechip">${dot(P[x.id].t)}${esc(P[x.id].n)} <span class="sub">${x.txt}</span><button class="term" data-rmrule="${x.id}" aria-label="Remove rule">✕</button></span>`).join("")}</div>` : ""}

      <div class="head" style="margin-top:14px"><b>Settings</b></div>
      <h4 class="mini-h">${term("hit", "Hits")}</h4>${seg("hitsmode", [["on","Allowed"],["one","At most one"],["off","None"]], RULES.hits, "Hits")}
      <h4 class="mini-h">Plan ahead</h4>${seg("horizon", [[3,"3 gameweeks"],[4,"4"],[6,"6"]], RULES.H, "Horizon")}
      <h4 class="mini-h">How much later weeks count</h4>${seg("decay", [[1,"Equal"],[0.9,"A bit less"],[0.8,"Much less"]], RULES.decay, "Weight of later weeks")}

function plansCompare(){
  const solved = PLANS.map((p, i) => ({p, i})).filter(x => x.p.result);
  if (solved.length < 2) return "";
  return `<h3>Compare drafts</h3><div class="scroller"><table class="log"><thead><tr><th>Draft</th><th class="n">Gain</th><th>GW${GWS[0]} moves</th><th class="n">Hits</th></tr></thead><tbody>
    ${solved.sort((a,b) => b.p.result.gain - a.p.result.gain).map(({p, i}) => { const r = p.result, s0 = r.steps[0] || {sells: [], buys: []};
      return `<tr data-planswitch="${i}" style="cursor:pointer"><td>${esc(p.name)}${r.gw0 !== GWS[0] ? ' <span class="sub">(old)</span>' : ""}</td><td class="n">+${f1(r.gain)}</td><td>${s0.chip ? CHIP_LONG[s0.chip] + ". " : ""}${s0.sells.map(id => P[id] ? esc(P[id].n) : "").join(", ") || "Roll"}${s0.buys.length ? " → " + s0.buys.map(id => P[id] ? esc(P[id].n) : "").join(", ") : ""}</td><td class="n">${r.hits ? "−" + r.hits * 4 : ""}</td></tr>`; }).join("")}</tbody></table></div>
    <p class="sub">Gains are over each draft’s own planning window. Tap a row to open that draft.</p>`;
}
function rememberResult(res){
  RULES.result = {gain: res.gain, gw0: GWS[0], hits: res.steps.reduce((s, x) => s + x.hits, 0),
    steps: res.steps.map(st => ({chip: st.chip, sells: st.sells.map(p => p.id), buys: st.buys.map(p => p.id)}))};
  persistPlans();
}
function altsHtml(){
  const A = state.alts; if (!A) return "";
  if (!A.length) return `<p class="lede">No other first-week plan comes close.</p>`;
  return `<h3>Alternative plans</h3><p class="lede">The next-best plans that start differently this week. The gap is what each one gives up against the best plan.</p>
    ${A.map((a, k) => { const s0 = a.res.steps[0]; return `<div class="draft"><div class="head"><b>Option ${k + 2}</b><span class="metric" style="font-size:22px">${sgn(a.gap)}<small>vs best</small></span></div>
      <div class="sub">GW${GWS[0]}: ${s0.chip ? CHIP_LONG[s0.chip] + ". " : ""}${s0.sells.map(p => esc(p.n)).join(", ") || "Roll the transfer"}${s0.buys.length ? " → " + s0.buys.map(p => esc(p.n)).join(", ") : ""}${s0.hits ? ` (−${s0.hits * 4})` : ""}. Captain ${esc(s0.cap ? s0.cap.n : "")}.</div></div>`; }).join("")}`;
}

function stressHtml(st){
  if (!st) return "";
  const rows = Object.entries(st.counts).sort((a,b) => b[1] - a[1]).slice(0, 10);
  return `<h3>${term("robust", "Stress test")}</h3><p class="lede">The solver re-run ${st.n} times with the projections shaken at random by about ±20%, looking at this week’s moves only.</p>
    <dl class="kv">${rows.map(([k, c]) => `<dt>${esc(k)}</dt><dd>${c} of ${st.n}</dd>`).join("")}</dl>
    <p class="sub">Moves that appear in most runs hold up even if the projections are a bit off. Ones that appear rarely depend on the numbers being exactly right.</p>`;
}

/* ---------- v6: season review ---------- */
function viewSeason(){
  const A = D.my && D.my.audit;
  if (!A) return `<div class="empty-state"><p class="name" style="margin:0 0 6px">Your season review appears once your team ID is set.</p><p class="lede">It needs the GitHub setup to read your transfers, captains and rank from FPL. Add the FPL_TEAM_ID variable and run the workflow.</p></div>`;
  const s = A.summary, W = A.weeks.filter(w => w.rank);
  const maxR = Math.max(...W.map(w => w.rank)), minR = Math.min(...W.map(w => w.rank));
  const ly = r => 20 + 110 * (Math.log(r) - Math.log(minR)) / Math.max(1e-6, Math.log(maxR) - Math.log(minR));
  const lx = k => 30 + 270 * k / Math.max(1, W.length - 1);
  const chart = W.length > 1 ? `<svg class="chart" viewBox="0 0 320 150" role="img" aria-label="Overall rank by gameweek"><polyline fill="none" stroke="var(--me)" stroke-width="2.5" points="${W.map((w,k) => `${lx(k)},${ly(w.rank)}`).join(" ")}"/>
    ${W.map((w,k) => `<circle cx="${lx(k)}" cy="${ly(w.rank)}" r="3" style="fill:var(--me)"/><text x="${lx(k)}" y="146" text-anchor="middle">${w.gw}</text>`).join("")}
    <text x="4" y="24">${(minR/1000).toFixed(0)}k</text><text x="4" y="132">${(maxR/1000).toFixed(0)}k</text></svg>` : "";
  const tr = [...A.transfers].sort((a,b) => b.gw - a.gw);
  return `<div class="stats"><div class="stat"><b>${(s.best_rank || 0).toLocaleString("en-GB")}</b><span>Best overall rank</span></div><div class="stat"><b>${sgn(s.net)}</b><span>Points from transfers</span><em>${s.good} of ${s.transfers} paid off</em></div><div class="stat"><b>${s.cap_best}/${s.cap_n}</b><span>Best captain picked</span><em>${s.cap_lost} pts missed</em></div></div>
    <p class="verdict">${s.net >= 0 ? `Your transfers have gained <b>${f1(s.net)} points</b> against keeping the players you sold, after ${s.hits} points of hits.` : `Your transfers have cost <b>${f1(-s.net)} points</b> against keeping the players you sold, including ${s.hits} points of hits.`} You picked the highest-scoring captain in your XI ${s.cap_best} times out of ${s.cap_n}, and left ${s.bench} points on your bench.</p>
    <h3>Overall rank</h3>${chart}
    <h3>Every transfer</h3><p class="lede">Points the new player scored against the one you sold, from that gameweek until you sold him on, minus any hit.</p>
    <ul class="list">${tr.map(t => `<li><div class="row" style="cursor:default"><div><div class="sub">GW${t.gw}, over ${t.weeks} gameweek${t.weeks === 1 ? "" : "s"}</div><div class="name">${esc(t.out)} → ${esc(t.inn)}</div><div class="sub">${t.pts_out} v ${t.pts_in} points${t.hit ? `, ${t.hit} hit` : ""}</div></div><div class="metric" style="color:var(--${t.net > 0 ? "up" : t.net < 0 ? "down" : "ink"})">${sgn(t.net)}<small>net</small></div></div></li>`).join("")}</ul>
    <h3>Captains</h3><div class="scroller"><table class="log"><thead><tr><th>GW</th><th>Your captain</th><th class="n">Pts</th><th>Best in your XI</th><th class="n">Pts</th></tr></thead>
    <tbody>${[...A.captains].reverse().map(c => `<tr><td>${c.gw}</td><td>${esc(c.cap)}${c.mult === 3 ? " (TC)" : ""}</td><td class="n">${c.cap_pts}</td><td>${c.lost ? esc(c.best) : "Same"}</td><td class="n">${c.lost ? c.best_pts : ""}</td></tr>`).join("")}</tbody></table></div>
    <h3>Week by week</h3><div class="scroller"><table class="log"><thead><tr><th>GW</th><th class="n">Points</th><th class="n">Bench</th><th class="n">Hits</th><th class="n">Rank</th></tr></thead>
    <tbody>${[...A.weeks].reverse().map(w => `<tr><td>${w.gw}${w.chip ? ` <span class="chip">${esc(CHIP_NAMES[w.chip] || w.chip)}</span>` : ""}</td><td class="n">${w.pts ?? "–"}</td><td class="n">${w.bench ?? "–"}</td><td class="n">${w.hits ? "−" + w.hits : ""}</td><td class="n">${w.rank ? w.rank.toLocaleString("en-GB") : "–"}</td></tr>`).join("")}</tbody></table></div>`;
}

/* ---------- form table and team outlook ---------- */
function pois(l, k){ let p = Math.exp(-l); for (let i = 1; i <= k; i++) p *= l / i; return p; }
function outcome(lf, la){
  let w = 0, d = 0, l = 0;
  for (let i = 0; i <= 10; i++) for (let j = 0; j <= 10; j++){ const pr = pois(lf, i) * pois(la, j); if (i > j) w += pr; else if (i === j) d += pr; else l += pr; }
  return {w, d, l, xpts: 3 * w + d};
}
function tableRows(win, venue){
  return D.teams.map(t => {
    let g = (t.results || []).filter(r => venue === "all" || (venue === "home" ? r[2] === 1 : r[2] === 0));
    if (win !== "season") g = g.slice(-win);
    const row = {t, p: g.length, w: 0, d: 0, l: 0, gf: 0, ga: 0, xgf: 0, xga: 0, xpts: 0, form: ""};
    g.forEach(r => { const [gw, opp, home, xf, xa, gf, ga] = r; row.gf += gf; row.ga += ga; row.xgf += xf; row.xga += xa; row.xpts += outcome(xf, xa).xpts;
      if (gf > ga) row.w++; else if (gf === ga) row.d++; else row.l++; row.form += gf > ga ? "W" : gf === ga ? "D" : "L"; });
    row.pts = 3 * row.w + row.d; row.gd = row.gf - row.ga; row.xgd = row.xgf - row.xga;
    return row;
  });
}
function rankRows(rows, key){
  const sorted = [...rows].sort((a,b) => key === "xpts" ? (b.xpts / Math.max(1, b.p)) - (a.xpts / Math.max(1, a.p)) || b.xgd - a.xgd
    : (b.pts / Math.max(1, b.p)) - (a.pts / Math.max(1, a.p)) || b.gd - a.gd || b.gf - a.gf);
  sorted.forEach((r, i) => r.rank = i + 1);
  return sorted;
}
function leaguePositions(){ const m = {}; rankRows(tableRows("season", "all"), "pts").forEach(r => m[r.t.id] = r.rank); return m; }
state.ft = state.ft || {win: 5, venue: "all", key: "pts"};
function teamOutlook(t){
  const league = leaguePositions(), pos = league[t.id];
  const attR = 1 + [...D.teams].sort((a,b) => b.att - a.att).findIndex(x => x.id === t.id);
  const defR = 1 + [...D.teams].sort((a,b) => a.dfn - b.dfn).findIndex(x => x.id === t.id);
  const season = tableRows("season", "all").find(r => r.t.id === t.id);
  const tierWord = r => r <= 3 ? "among the very best" : r <= 7 ? "strong" : r <= 13 ? "mid-table" : r <= 17 ? "below average" : "among the weakest";
  let s1 = `On the underlying numbers, ${esc(t.name)} rate ${ord(attR)} for attack (${tierWord(attR)}) and ${ord(defR)} for defence, and they sit ${ord(pos)} in the table.`;
  if (season && season.p >= 3){
    const gap = season.pts - season.xpts;
    s1 += gap <= -3 ? ` Results haven’t matched the performances: ${season.pts} points from games worth about ${f1(season.xpts)}, so expect them to climb.`
      : gap >= 3 ? ` They’ve picked up more points than their performances deserve (${season.pts} from games worth about ${f1(season.xpts)}), so they may slip.`
      : ` Their position is a fair reflection of how they’ve played (${season.pts} points from games worth about ${f1(season.xpts)}).`;
  }
  const g = GWS[0], list = FX[t.id][g] || [];
  if (!list.length) return `<p class="verdict" style="font-size:16px">${s1} They don’t play in GW${g}.</p>`;
  const six = GWS.flatMap(x => (FX[t.id][x] || []).map(f => f.lf)).sort((a,b) => b - a);
  const parts = list.map(f => {
    const O = T[f.opp], o = outcome(f.lf, f.la), cs = Math.exp(-f.la), b = f.f && f.f.book;
    const oRank = 21 - O.r_xga;   // 1 = concedes the most
    const oppV = f.home ? O.away : O.home;
    const test = oRank <= 6 ? "a good chance to score" : oRank >= 15 ? "a tough fixture to score in" : "an average fixture for scoring";
    const vtxt = !oppV ? "" : oppV.xga > O.xga * 1.15 ? `, though they concede more ${f.home ? "away from home" : "at home"} (${f2(oppV.xga)})` : oppV.xga < O.xga * 0.87 ? `, and fewer still ${f.home ? "away from home" : "at home"} (${f2(oppV.xga)})` : "";
    const k = 1 + six.indexOf(f.lf);
    const win = b ? (f.home ? b.ph : b.pa) : o.w;
    const att = f.lf >= 1.9 ? "their attackers are strong picks" : f.lf >= 1.4 ? "their attackers are decent options" : f.lf >= 1.1 ? "their attackers are only worth it if they’re nailed" : "it’s a week to bench or avoid their attackers";
    const dfn = cs >= 0.4 ? "their goalkeeper and defenders are good bets" : cs >= 0.25 ? "a clean sheet is roughly a coin-flip for their defence" : "their defenders are best avoided";
    return `In GW${g}, ${esc(t.name)} ${f.home ? "host" : "travel to"} ${esc(O.name)}. ${esc(O.name)} concede ${f2(O.xga)} xG a game, ${oRank === 1 ? "the most in the league" : oRank === 20 ? "the fewest in the league" : oRank <= 10 ? `the ${ord(oRank)}-most` : `the ${ord(21 - oRank)}-fewest`}${vtxt}, so this looks like ${test}.
      The model expects ${esc(t.short)} to score ${f2(f.lf)} and concede ${f2(f.la)}: a ${pct(win)} chance of winning${b ? " on the bookmakers’ odds" : ""} and a ${pct(cs)} chance of a clean sheet. ${k === 1 ? "It’s their best attacking fixture of the next six." : `It’s their ${ord(k)}-best attacking fixture of the next six.`}
      Most likely scores, ${esc(t.short)} first: ${scoreText(f.lf, f.la)}.
      <b>For FPL:</b> ${att}, and ${dfn}.`;
  });
  return `<p class="verdict" style="font-size:16px">${s1}</p><p class="verdict" style="font-size:16px">${parts.join(" ")}</p>`;
}

/* ---------- v6.2: scorelines, player week, player form, team head-to-head, fixture swings ---------- */
function scorelines(lh, la, n = 3){
  const out = [];
  for (let i = 0; i <= 6; i++) for (let j = 0; j <= 6; j++) out.push([i, j, pois(lh, i) * pois(la, j)]);
  return out.sort((a,b) => b[2] - a[2]).slice(0, n);
}
const scoreText = (lh, la) => scorelines(lh, la).map(([i, j, p]) => `${i}–${j} (${pct(p)})`).join(", ");
function playerWeek(p){
  const n = p.next; if (!n) return "";
  const O = T[n.opp], tm = T[p.t], f = (FX[p.t][GWS[0]] || [])[0];
  const peers = D.players.filter(q => q.pos === p.pos && q.next && available(q));
  const rk = (key) => 1 + peers.filter(q => q.next[key] > n[key] + 1e-9).length;
  const lines = [];
  if (p.pos >= 3 || p.share_g >= 0.08){
    const oR = 21 - O.r_xga;
    const where = n.home ? `plays at home to ${O.name}` : `goes away to ${O.name}`;
    const tough = oR >= 15 ? `${where}, who concede ${f2(O.xga)} xG a game, ${oR === 20 ? "the fewest in the league" : `the ${ord(21 - oR)}-fewest`}` :
      oR <= 6 ? `${where}, who concede ${f2(O.xga)} xG a game, ${oR === 1 ? "the most in the league" : `the ${ord(oR)}-most`}` : `${where}, an average defence (${f2(O.xga)} xG conceded a game)`;
    const share = `takes ${pct(p.share_g)} of ${tm.name}’s expected goals`;
    const r = rk("xg");
    lines.push(`This week ${esc(p.n)} ${tough}. ${oR >= 15 ? "But he" : "He"} ${share}, so ${f2(n.xg)} xG is ${r === 1 ? "the highest" : `the ${ord(r)}-highest`} of any ${POS_LONG[p.pos]} this week, with a ${pct(n.ret)} chance of a goal or assist.`);
  }
  if (p.pos <= 2){
    const r = rk("cs");
    lines.push(`${p.pos >= 3 || p.share_g >= 0.08 ? "At the back, " : `This week ${esc(p.n)} ${n.home ? "plays at home to" : "goes away to"} ${esc(O.name)}. `}${esc(tm.name)} have a ${pct(n.cs)} chance of a clean sheet, ${r === 1 ? "the best" : `the ${ord(r)}-best`} of any team this week${O.r_xgf <= 6 ? `, against one of the league’s stronger attacks (${f2(O.xgf)} xG a game)` : O.r_xgf >= 15 ? `, against one of the weakest attacks (${f2(O.xgf)} xG a game)` : ""}.`);
    if (p.pos === 2 && n.dc_p >= 0.3) lines.push(`He also has a ${pct(n.dc_p)} chance of DEFCON points.`);
  }
  if (f) lines.push(`Most likely scores, ${esc(tm.short)} first: ${scoreText(f.lf, f.la)}.`);
  return `<p class="verdict" style="font-size:16px">${lines.join(" ")}</p>`;
}
state.pf = state.pf || {n: 5, metric: "xgi", pos: 0};
function viewPlayerForm(){
  const f = state.pf, val = r => f.metric === "xg" ? r[4] : f.metric === "xa" ? r[5] : f.metric === "pts" ? r[6] : r[4] + r[5];
  const rows = D.players.filter(p => available(p) && p.form && p.form.length && (!f.pos || p.pos === f.pos)).map(p => {
    const g = p.form.slice(-f.n), mins = g.reduce((s, r) => s + r[3], 0), tot = g.reduce((s, r) => s + val(r), 0);
    const season = p.season && p.season.mins ? (f.metric === "xg" ? p.season.xg90 : f.metric === "xa" ? p.season.xa90 : f.metric === "pts" ? p.season.pts / p.season.mins * 90 : p.season.xg90 + p.season.xa90) : 0;
    return {p, tot, mins, per90: mins ? tot / mins * 90 : 0, season};
  }).filter(r => r.mins >= 45 * Math.min(f.n, 3)).sort((a,b) => b.tot - a.tot).slice(0, 25);
  const label = {xg:"xG", xa:"xA", xgi:"xG + xA", pts:"points"}[f.metric];
  return `<h2>In form</h2><p class="lede">Who’s producing right now: totals over each player’s last ${f.n} league games, with his rate per 90 against his season rate. A big jump can mean a new role or position, so it’s worth reading his explanations.</p>

// form map: attack quality against recent trend
// dots and labels for the team maps: nudges overlapping dots apart and places each label where it doesn't collide
function mapDots(pts, bounds){
  const [L, R, Tp, B] = bounds, r = 7;
  // spread dots that sit on top of each other
  for (let it = 0; it < 30; it++) for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++){
    const a = pts[i], b = pts[j], dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 0.01, min = 2 * r + 2;
    if (d < min){ const push = (min - d) / 2, ux = dx / d || 1, uy = dy / d; a.x -= ux * push; a.y -= uy * push; b.x += ux * push; b.y += uy * push; }
  }
  pts.forEach(p => { p.x = Math.max(L + r, Math.min(R - r, p.x)); p.y = Math.max(Tp + r, Math.min(B - r, p.y)); });
  const boxes = pts.map(p => ({x0: p.x - r, x1: p.x + r, y0: p.y - r, y1: p.y + r}));
  const hit = (b) => boxes.some(o => b.x0 < o.x1 && b.x1 > o.x0 && b.y0 < o.y1 && b.y1 > o.y0);
  const out = [];
  [...pts].sort((a,b) => a.y - b.y).forEach(p => {
    const w = 6.4 * p.label.length + 2, h = 11;
    const tries = [[0, -11, "middle"], [0, 19, "middle"], [10, 4, "start"], [-10, 4, "end"], [0, -21, "middle"], [0, 29, "middle"], [14, -8, "start"], [-14, -8, "end"]];
    let best = null;
    for (const [ox, oy, anchor] of tries){
      const x = p.x + ox, y = p.y + oy, x0 = anchor === "middle" ? x - w / 2 : anchor === "start" ? x : x - w, b = {x0, x1: x0 + w, y0: y - h + 2, y1: y + 2};
      if (b.x0 < L - 30 || b.x1 > R + 8 || b.y0 < 0) continue;
      if (!hit(b)){ best = {x, y, anchor, b}; break; }
      if (!best) best = {x, y, anchor, b};

}

    <rect x="${L}" y="${midY}" width="${midX - L}" height="${B - midY}" fill="#F1EFE8" opacity=".7"/><rect x="${midX}" y="${midY}" width="${R - midX}" height="${B - midY}" fill="#E6F1FB" opacity=".8"/>

// Future tab: who is about to heat up or cool down
function teamForecast(t, n = 4){
  const r = (T[t].results || []).slice(-n), last = r.length ? r.reduce((s, x) => s + x[3], 0) / r.length : T[t].xgf;
  const fx = GWS.slice(0, n).flatMap(g => (FX[t][g] || []));
  const next = fx.length ? fx.reduce((s, f) => s + f.lf, 0) / fx.length : null;
  return {last, next, change: next == null ? 0 : next - last, fx, season: T[t].xgf};
}
function forecastReason(t, f){
  const opp = f.fx.map(x => T[x.opp].short + (x.home ? " (H)" : " (A)")).join(", ");
  const parts = [];
  if (f.last < f.season * 0.9) parts.push(`their last four were below their usual level (${f2(f.last)} against ${f2(f.season)} a game), and dips like that usually end`);
  if (f.last > f.season * 1.1) parts.push(`their last four were above their usual level (${f2(f.last)} against ${f2(f.season)}), and hot runs usually cool`);
  const easy = f.fx.filter(x => xgClass(x.lf) <= 2).length, hard = f.fx.filter(x => xgClass(x.lf) >= 4).length;
  if (easy >= 2) parts.push(`${easy} of the next ${f.fx.length} are good fixtures to score in`);
  if (hard >= 2) parts.push(`${hard} of the next ${f.fx.length} are tough fixtures to score in`);
  const body = parts.length ? parts.join("; ") : "mostly about the fixtures";
  return `Next ${f.fx.length}: ${opp}. ${body.charAt(0).toUpperCase() + body.slice(1)}.`;
}
function dumbbell(list){

  return `<svg class="dumb" viewBox="0 0 ${W} ${list.length * row + 26}" role="img" aria-label="Last ${FORM_N} games against the next ${FORM_N} forecast, expected goals per game">
    ${[0, 1, 2, 3].filter(v => v <= max).map(v => `<line x1="${xs(v)}" y1="4" x2="${xs(v)}" y2="${list.length * row + 4}" stroke="var(--line)"/><text x="${xs(v)}" y="${list.length * row + 18}" class="alab" text-anchor="middle">${v}</text>`).join("")}
    ${list.map((x, i) => { const y = 16 + i * row, a = xs(x.f.last), b = xs(x.f.next), up = x.f.change >= 0, col = up ? "#1D9E75" : "#E24B4A";
      return `<g data-team="${x.t.id}" style="cursor:pointer"><text x="4" y="${y + 4}" class="mlab" text-anchor="start">${esc(x.t.short)}</text><line x1="${a}" y1="${y}" x2="${b}" y2="${y}" stroke="${col}" stroke-width="3"/>

    <div class="keyline"><span class="lk"><i style="background:var(--chalk)"></i>Last ${FORM_N}, xG a game</span><span class="lk"><i style="background:#1D9E75"></i>Forecast next ${FORM_N}: up</span><span class="lk"><i style="background:#E24B4A"></i>down</span></div>`;

// 2. Verdicts: Buy, Watch or Don't buy for players you don't own; Hold or Sell for yours
let VERDICTS = null;
function planSellGw(id){
  const r = RULES && RULES.result; if (!r || r.gw0 !== GWS[0]) return null;

}
function buildVerdicts(){

  D.players.forEach(p => {
    const s = pick(p), ms = minutesSecurity(p), out_ = p.st === "i" || p.st === "s" || p.st === "u", posN = POS_LONG[p.pos];

      if (s.pct_timing >= 0.7) reasons.push("fixtures best right now"); else if (s.pct_timing <= 0.25) weak.push(`fixtures improve from GW${GWS[3]}`);
      if (s.pct_rel <= 0.3) weak.push("minutes not secure"); else if (s.pct_rel >= 0.6 && ms.level === "green") reasons.push("nailed");

      const gain = repl ? repl.ep6 - p.ep6 - 1.5 : 0;   // what a free transfer is worth, roughly

      else if (ms.level === "red"){ word = "Sell"; strength = "Lean"; reasons.unshift("rarely starting"); }
      else if (gain >= 3){ word = "Sell"; strength = gain >= 7 ? "Strong" : "Lean"; reasons.unshift(`${repl.n} would add ${f1(gain + 1.5)} over ${GWS.length} for money you have`); }

    } else if (!s || out_){

}

/* ---------- v6.12: pick score (weights fitted on last season) ---------- */
// Tested on 2025/26 (1,559 player-windows held out): value over a typical nailed player at the same price did almost
// all the work; timing, minutes and ceiling added a little; underlying form and price momentum added nothing.
const PICK_W = {val: 0.745, timing: 0.147, rel: 0.065, ceil: 0.037};
const PICK_TEST = {n: 804, buy_gain: 4.63, buy_beat: 0.59, watch_gain: 2.31, watch_beat: 0.50, no_gain: -0.17, no_beat: 0.43, low_gain: -1.23, spearman: 0.49};
let PICK = null;
function pickParts(p){
  const g = (p.form || []).slice(-5), starts = g.reduce((s, r) => s + (r[7] != null ? r[7] : r[3] >= 60 ? 1 : 0), 0), mins = g.reduce((s, r) => s + r[3], 0);
  const early = p.ep.slice(0, 3).reduce((a,b) => a + b, 0), late = p.ep.slice(3, 6).reduce((a,b) => a + b, 0);
  return {rel: 0.5 * starts / 5 + 0.5 * Math.min(1, mins / 450), timing: (early - late) / Math.max(1, p.ep6), ceil: (p.share_g || 0) + (p.share_a || 0), starts};
}
function buildPick(){
  const pool = D.players.filter(p => available(p) && p.ep6 > 0.5), out = {}, raw = {};
  const nailed = pool.filter(p => pickParts(p).starts >= 3);
  pool.forEach(p => {
    const peers = nailed.filter(q => q.pos === p.pos && Math.abs(q.price - p.price) <= 0.5 + 1e-9).map(q => q.ep6).sort((a,b) => a - b);
    const ref = peers.length >= 3 ? peers : nailed.filter(q => q.pos === p.pos).map(q => q.ep6).sort((a,b) => a - b);
    const med = ref.length ? ref[Math.floor(ref.length / 2)] : 0;
    raw[p.id] = Object.assign({val: p.ep6 - med, med}, pickParts(p));
  });
  const stats = {};
  [1,2,3,4].forEach(pos => { const ps = pool.filter(p => p.pos === pos); stats[pos] = {};
    ["val","timing","rel","ceil"].forEach(k => { const v = ps.map(p => raw[p.id][k]), m = v.reduce((a,b) => a + b, 0) / Math.max(1, v.length);
      const sd = Math.sqrt(v.reduce((a,b) => a + (b - m) ** 2, 0) / Math.max(1, v.length)) || 1; stats[pos][k] = {m, sd}; }); });
  pool.forEach(p => { const r = raw[p.id], z = {}; ["val","timing","rel","ceil"].forEach(k => z[k] = (r[k] - stats[p.pos][k].m) / stats[p.pos][k].sd);
    r.z = z; r.s = Object.keys(PICK_W).reduce((a, k) => a + PICK_W[k] * z[k], 0); });
  // scores are percentiles against regular starters at the position (3+ starts in the last 5): tested to be the more selective version
  const below = (arr, v) => { let n = 0; for (const x of arr) if (x < v) n++; else if (x === v) n += 0.5; return n / Math.max(1, arr.length); };
  [1,2,3,4].forEach(pos => {
    const ps = pool.filter(p => p.pos === pos), ref = nailed.filter(p => p.pos === pos), base = ref.length >= 10 ? ref : ps;
    const sArr = base.map(p => raw[p.id].s), parts = {}; ["val","timing","rel","ceil"].forEach(k => parts[k] = base.map(p => raw[p.id].z[k]));
    ps.forEach(p => { const r = raw[p.id]; r.score = Math.max(1, Math.min(100, Math.round(100 * below(sArr, r.s))));
      ["val","timing","rel","ceil"].forEach(k => r["pct_" + k] = below(parts[k], r.z[k])); out[p.id] = r; });
  });
  return out;
}
const pick = p => { if (!PICK) PICK = buildPick(); return PICK[p.id] || null; };
function pickRing(p, size = 64){
  const s = pick(p); if (!s) return "";
  const parts = [["val","Value"],["timing","Timing"],["rel","Minutes"],["ceil","Ceiling"]], tot = 1, R = 26, C = 2 * Math.PI * R;
  let off = 0;
  const col = q => q >= 0.6 ? "#1D9E75" : q >= 0.4 ? "#E8B10C" : "#E24B4A";
  const segs = parts.map(([k]) => { const len = C * PICK_W[k] / tot, seg = `<circle r="${R}" cx="32" cy="32" fill="none" stroke="${col(s["pct_" + k])}" stroke-width="7" stroke-dasharray="${Math.max(0, len - 2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 32 32)"><title>${k}</title></circle>`; off += len; return seg; }).join("");
  return `<svg class="pring" viewBox="0 0 64 64" width="${size}" height="${size}" role="img" aria-label="Pick score ${s.score} of 100">${segs}<text x="32" y="37" text-anchor="middle">${s.score}</text></svg>`;
}
function pickKey(p){
  const s = pick(p); if (!s) return "";
  const word = q => q >= 0.6 ? "good" : q >= 0.4 ? "okay" : "weak";
  return `<div class="pkey">${[["val","Value"],["timing","Timing"],["rel","Minutes"],["ceil","Ceiling"]].map(([k, l]) => `<span><i class="${word(s["pct_" + k])}"></i>${l}: ${word(s["pct_" + k])}</span>`).join("")}</div>`;
}

/* ---------- v6.13: points as blocks, player type, plain sentence, typical comparison ---------- */
const PB_ORDER = [["app","Playing","#B4B2A9"],["goals","Goals","#D85A30"],["pens","Penalties","#993C1D"],["assists","Assists","#EF9F27"],["cs","Clean sheet","#1D9E75"],["defcon","DEFCON","#7F77DD"],["saves","Saves","#378ADD"],["bonus","Bonus","#D4537E"]];
function playerType(p, bd){
  bd = bd || (p.next && p.next.breakdown); if (!bd) return null;
  const pos = Object.values(bd).reduce((s, v) => s + Math.max(0, v), 0) || 1, sh = k => Math.max(0, bd[k] || 0) / pos;
  const att = sh("goals") + sh("pens");
  if (p.pos === 1) return sh("saves") >= 0.2 ? {t: "Save-heavy keeper", c: "#378ADD"} : {t: "Clean-sheet keeper", c: "#1D9E75"};
  if (p.pos === 2){
    if (att + sh("assists") >= 0.28) return {t: "Attacking defender", c: "#D85A30"};
    if (sh("defcon") >= 0.15) return {t: "DEFCON earner", c: "#7F77DD"};
    return att >= 0.12 ? {t: "Clean-sheet defender with a goal threat", c: "#1D9E75"} : {t: "Clean-sheet defender", c: "#1D9E75"};
  }
  if (att >= 0.33) return {t: "Goal threat", c: "#D85A30"};
  if (sh("assists") >= 0.14 && sh("assists") >= att * 0.6) return {t: "Creator", c: "#EF9F27"};
  if (sh("defcon") >= 0.12) return {t: "DEFCON earner", c: "#7F77DD"};
  if (sh("bonus") >= 0.2) return {t: "Bonus magnet", c: "#D4537E"};
  return {t: "All-rounder", c: "#888780"};
}
const typeTag = p => { const t = playerType(p); return t ? `<span class="ptype" style="color:${t.c};border-color:${t.c}">${esc(t.t)}</span>` : ""; };
let TYPICAL = null;
function typicalBreakdown(pos, six){

/* ---------- v6.15: draft transfers on the pitch ---------- */
// Moves live in the active planner draft: RULES.moves = [{gw, out, in}]. Your real squad is never changed by them.
function draftMoves(){ if (!RULES.moves) RULES.moves = []; return RULES.moves; }
function draftIdsAt(i){
  let ids = [...state.squad.ids];
  draftMoves().filter(m => GWS.indexOf(m.gw) <= i && GWS.indexOf(m.gw) >= 0).sort((a,b) => a.gw - b.gw).forEach(m => { ids = ids.map(x => x === m.out ? m.in : x); });

}
const draftSquadAt = i => draftIdsAt(i).map(id => P[id]).filter(Boolean);
function draftState(){

  let ft = Number(state.squad.ft || 1), bank = Number(state.squad.bank || 0), hits = 0;
  GWS.forEach((g, i) => {
    const ms = draftMoves().filter(m => m.gw === g);
    ms.forEach(m => { const o = P[m.out], c = P[m.in]; bank += ((base.has(m.out) ? sellPriceOf(o) : null) || (o ? o.price : 0)) - (c ? c.price : 0); });
    const h = Math.max(0, ms.length - ft); hits += h;
    out.push({gw: g, n: ms.length, ftBefore: ft, hits: h, bank: +bank.toFixed(1)});
    ft = ms.length >= ft ? 1 : Math.min(5, ft - ms.length + 1);

  return {weeks: out, hits};
}
function draftGain(){
  const base = state.squad.ids.map(id => P[id]); let d = 0;
  for (let i = 0; i < GWS.length; i++) d += bestXI(draftSquadAt(i), i).total - bestXI(base, i).total;
  return d - 4 * draftState().hits;
}
function draftBar(){
  const i = state.pitchGw, st = draftState(), w = st.weeks[i], n = draftMoves().length;
  if (!n) return `<div class="draftbar empty"><span><b>${esc(RULES.name)}</b>: tap any player to try a transfer. Your real squad isn’t changed.</span></div>`;
  const gain = draftGain();
  return `<div class="draftbar"><div><small>${esc(RULES.name)}, GW${w.gw}</small><b>${w.n} move${w.n === 1 ? "" : "s"}${w.hits ? `, −${w.hits * 4}` : ""}</b></div>
    <div><small>Free transfers, bank</small><b>${Math.max(0, w.ftBefore - w.n)} left, ${money(w.bank)}</b></div>
    <div><small>Next ${GWS.length} GWs</small><b class="${gain >= 0 ? "upc" : "downc"}">${gain >= 0 ? "+" : "−"}${f1(Math.abs(gain))}</b></div></div>
    <div class="optgrid draftacts"><button class="optrow" data-draftundo="1">Undo last move</button><button class="optrow" data-draftreset="1">Reset draft</button>
      <button class="optrow" data-draftsolve="1">Let the solver finish this</button><button class="optrow" data-draftapply="1">Make GW${GWS[0]} moves my squad</button></div>
    ${w.bank < 0 ? `<p class="sub" style="color:var(--down)">Over budget by ${money(-w.bank)} in GW${w.gw}.</p>` : ""}`;
}
function openTransferOut(outId){

  const list = D.players.filter(c => c.pos === o.pos && !ids.has(c.id) && !banned.has(c.id) && available(c) && c.price <= budget + 1e-9 && (clubs[c.t] || 0) < 3

    .sort((a,b) => ((pick(b) || {}).score || 0) - ((pick(a) || {}).score || 0) || gainOf(b) - gainOf(a)).slice(0, 30);

function addDraftMove(outId, inId){
  const g = GWS[state.pitchGw], ms = draftMoves();
  // if the player going out was brought in earlier in this draft, change that earlier move instead of adding another
  const earlier = ms.find(m => m.in === outId && m.gw === g);
  if (earlier) { earlier.in = inId; if (earlier.in === earlier.out) ms.splice(ms.indexOf(earlier), 1); }

// planner rules from the draft: players kept in until the end become "buy by", players gone for good "sell by"
function draftRules(){
  const last = draftIdsAt(GWS.length - 1), base = new Set(state.squad.ids), buys = [], sells = [];
  draftMoves().forEach(m => {
    if (last.includes(m.in) && !base.has(m.in)) buys.push({id: m.in, t: Math.max(0, GWS.indexOf(m.gw))});
    if (!last.includes(m.out) && base.has(m.out)) sells.push({id: m.out, t: Math.max(0, GWS.indexOf(m.gw))});

/* ---------- role tracker: deep, mixed or advanced, from each match's passes and touches ---------- */
let ROLE_NORM = null;
function roleNorms(){
  if (ROLE_NORM) return ROLE_NORM;
  const v = []; D.players.filter(p => p.pos === 3).forEach(p => (p.form || []).forEach(r => { if (r[3] >= 45 && r[11] != null) v.push(r[11] / r[3] * 90); }));
  v.sort((a,b) => a - b);
  ROLE_NORM = {med: v.length ? v[Math.floor(v.length / 2)] : 35};
  return ROLE_NORM;
}
function matchRole(r){
  if (!r || r[3] < 20 || r[11] == null) return null;
  const pass90 = r[11] / r[3] * 90, box90 = (r[12] || 0) / r[3] * 90, med = roleNorms().med;
  if (pass90 >= med * 1.2 && box90 < 3) return "deep";
  if (pass90 <= med * 0.8 || box90 >= 4) return "advanced";
  return "mixed";
}
function roleTracker(p){
  if (p.pos !== 3 || !p.form || !p.form.some(r => r[11] != null)) return "";
  const games = p.form.map(r => ({r, role: matchRole(r)})).filter(x => x.role);
  if (games.length < 3) return "";
  const label = {deep: "Deep", mixed: "Mixed", advanced: "Advanced"};
  const by = k => games.filter(g => g.role === k), stat = k => { const g = by(k); return {n: g.length, pts: g.reduce((s, x) => s + x.r[6], 0), goals: g.reduce((s, x) => s + x.r[8], 0), xg: g.reduce((s, x) => s + x.r[4], 0)}; };
  const adv = stat("advanced"), deep = stat("deep"), mix = stat("mixed"), last5 = games.slice(-5), adv5 = last5.filter(g => g.role === "advanced").length;
  const line = k => { const s_ = stat(k); return s_.n ? `<tr><td>${label[k]}</td><td class="n">${s_.n}</td><td class="n">${f1(s_.pts / s_.n)}</td><td class="n">${f2(s_.xg / s_.n)}</td><td class="n">${s_.goals}</td></tr>` : ""; };
  const summary = adv5 >= 4 ? `He’s played advanced in ${adv5} of his last ${last5.length}, so the projection is built mostly on that role.`
    : last5.filter(g => g.role === "deep").length >= 3 ? `He’s mostly played deep lately, which usually means fewer shots.` : `His role has been switching, so his attacking numbers are less settled.`;
  return `<h3>Role tracker</h3><p class="lede">Where he played each game, judged from how much of the ball he had: holding players see lots of it and pass a lot, a No. 10 sees less of it, further forward. ${summary}</p>
    <div class="rstrip">${games.map(g => `<span class="rr ${g.role}" title="GW${g.r[0]} v ${esc(g.r[1])}: ${g.r[11]} passes, ${g.r[12] || 0} box touches, ${g.r[6]} pts"><b>GW${g.r[0]}</b>${label[g.role]}${g.r[8] ? `<em>${"⚽".repeat(Math.min(3, g.r[8]))}</em>` : ""}</span>`).join("")}</div>
    <table class="log rtab"><thead><tr><th>Role</th><th class="n">Games</th><th class="n">Pts a game</th><th class="n">xG a game</th><th class="n">Goals</th></tr></thead><tbody>${line("advanced")}${line("mixed")}${line("deep")}</tbody></table>
    <p class="sub">Shown for information; the projection already leans on his recent games.</p>`;
}

function viewSplit(){

    <div class="hchips">${chip(`Best for ${def ? "defenders" : "attackers"}:`, best, "up")}${chip("Getting better:", turns, "info")}${chip("Avoid:", worst, "down")}</div>

    <tbody>${teams.map(t => { const tg = runTag(t), tot = total(t);
